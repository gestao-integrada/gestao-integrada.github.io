<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BI da Frota · Gestão Integrada</title>
<meta name="theme-color" content="#16324f">
<link rel="stylesheet" href="../rota/leaflet.css">
<style>
/* mesmo visual das outras páginas (tema claro fixo) */
:root{--bg:#f4f6fb;--card:#fff;--card2:#f8fafc;--ink:#0f172a;--mut:#5b6678;--line:#e4e8f0;--brand:#2563eb;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --red:#dc2626;--redbg:#fdecec;--ora:#c2410c;--orabg:#fff1e6;--yel:#a16207;--yelbg:#fef6d8;--grn:#15803d;--grnbg:#e7f6ec;
  --blu:#1d4ed8;--blubg:#e8efff;--gry:#64748b;--grybg:#eef2f7;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 80px}
header.top{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:16px 0 6px}
header.top .tt{margin-right:auto;min-width:0}
header.top h1{font-size:20px;margin:0}
header.top .sub{color:var(--mut);font-size:13px;margin:0}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 13px system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#c9d1de}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.red{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.6;cursor:default}
.who{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:6px 0 10px;scrollbar-width:thin}
.tab{border:0;background:none;padding:9px 12px;font-weight:600;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab .tag{font-size:10px;font-weight:700;background:var(--grybg);color:var(--gry);border-radius:999px;padding:0 6px;margin-left:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.bar label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.bar input,.bar select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;min-width:0;max-width:240px}
.faixa{border-radius:10px;padding:9px 12px;margin:8px 0;font-size:14px;border:1px solid var(--line);background:var(--card)}
.faixa.warn{background:var(--orabg);border-color:#f6c9a8;color:var(--ora);font-weight:600}
.faixa.info{background:var(--blubg);border-color:#c7d6fb;color:var(--blu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);text-align:left}
.kpi b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mut)}
.kpi small{display:block;font-size:11px;color:var(--mut)}
.kpi.dr:hover{border-color:var(--brand)}.kpi.ok b{color:var(--grn)}.kpi.bad b{color:var(--red)}.kpi.warn b{color:var(--ora)}.kpi.blu b{color:var(--blu)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.cols3{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:8px 0}
@media (max-width:820px){.cols,.cols3{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;min-width:0;margin-bottom:10px}
.box h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box h3 .r{margin-left:auto;text-transform:none;letter-spacing:0}
.rk{width:100%;border-collapse:collapse;font-size:13px}
.rk td{padding:4px 4px;border-top:1px solid var(--line);vertical-align:top}
.rk td.n{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.rk .barra{height:6px;background:var(--blubg);border-radius:3px;margin-top:2px}.rk .barra i{display:block;height:6px;background:var(--brand);border-radius:3px}
.scroll{max-height:440px;overflow-y:auto}
.tb{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{position:sticky;top:0;background:var(--card2);text-align:left;font-size:12px;color:var(--mut);padding:6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
table.dt td{padding:5px 6px;border-top:1px solid var(--line);white-space:nowrap}
table.dt td.w{white-space:normal;min-width:160px}
table.dt td.n{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.c-ok{background:var(--grnbg);color:var(--grn)}.c-bad{background:var(--redbg);color:var(--red)}.c-warn{background:var(--orabg);color:var(--ora)}
.c-gry{background:var(--grybg);color:var(--gry)}.c-blu{background:var(--blubg);color:var(--blu)}
.chip.rot{font-size:15px;padding:4px 11px}
.vazio{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--mut);text-align:center}
.note{font-size:12px;color:var(--mut)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin:4px 0}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
svg text{font:11px system-ui,sans-serif;fill:var(--mut)}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.login h2{margin:0 0 6px;font-size:19px}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:10px 0}
.login .btn{width:100%;justify-content:center;padding:9px}
.msg{font-size:13px;margin-top:8px}.msg.err{color:var(--red)}.msg.ok{color:var(--grn)}
#mapa,#mapaFora{height:520px;border-radius:12px;border:1px solid var(--line);background:#dfe5ee}
#mapaFora{height:380px}
.cerca{border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--card)}
.cerca b{font-size:15px}.cerca .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.cerca ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.form label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
.form input,.form select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
.rdias{display:flex;gap:3px}.rdias label{display:flex!important;flex-direction:column;align-items:center;font-size:10px!important;margin:0!important;padding:0!important}.rdias input{width:auto!important;margin:0!important}
.regra{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--card2)}
.regra .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.regra .g label{margin:0}
.chks{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.chks label{display:inline-flex;gap:4px;align-items:center;margin:0;color:var(--ink)}
.chks input{width:auto}
.dr{cursor:pointer}.rk tr.dr:hover td{background:var(--card2)}svg rect.dr:hover{opacity:.75}table.dt tr.dr:hover td{background:var(--blubg)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;z-index:1000}
.dlg{background:var(--card);border-radius:14px;max-width:1000px;width:100%;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h2{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dlg h2 .r{margin-left:auto;display:flex;gap:6px}
.dica{font-size:12px;color:var(--mut);background:var(--yelbg);border-radius:8px;padding:6px 9px;margin:6px 0}
.pilha{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#eef2f7}.pilha i{display:block;height:100%}
.colw{overflow-x:auto;padding:18px 4px 0 34px}
.plot{position:relative;height:200px;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid #94a3b8}
.plot .c{flex:1 1 0;max-width:60px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;z-index:1}
.plot .c i{display:block;width:100%;border-radius:3px 3px 0 0;min-height:1px}
.plot .c b{font-size:11px;font-weight:600;color:#334155;margin-bottom:2px;white-space:nowrap}
.plot .c.dr:hover i{filter:brightness(1.15)}
.plot .grade{position:absolute;left:0;right:0;border-top:1px dashed #e2e8f0}
.plot .grade span{position:absolute;left:-34px;top:-7px;font-size:10px;color:#94a3b8;width:30px;text-align:right}
.plot .ideal{position:absolute;left:0;right:0;border-top:2px dashed #0f172a;z-index:2;pointer-events:none}
.plot .ideal span{position:absolute;right:0;top:-17px;font-size:11px;font-weight:700;background:#fff;padding:0 4px}
.eixo{display:flex;justify-content:center;gap:3px}.eixo span{flex:1 1 0;max-width:60px;font-size:10px;color:#64748b;text-align:center;white-space:nowrap;overflow:visible}
.tipH{background:#fff;border:0;padding:0 3px;font-size:11px;font-weight:700;box-shadow:none}
</style>
</head>
<body>
<div id="vLogin" class="login hidden">
  <h2>BI da Frota</h2>
  <div class="note">Use a sua senha pessoal da Central (ou a senha de gestores).</div>
  <form id="fLogin"><input id="lSenha" type="password" autocomplete="current-password" placeholder="Senha" required>
  <button class="btn p">Entrar</button></form>
  <div id="lMsg" class="msg"></div>
</div>

<div id="vApp" class="wrap hidden">
  <header class="top">
    <div class="tt"><h1>BI da Frota</h1>
      <p class="sub">Ocupação, horários, fora de rota e custos dos ônibus (dados da TFleet + GPS do Monitor)</p></div>
    <span class="who" id="who"></span>
    <a class="btn" href="../dds/">DDS do dia</a>
    <a class="btn" href="../">Início</a>
    <button class="btn" id="bSair">Sair</button>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="bar" id="filtros">
    <label>Período <select id="fPer"><option value="">escolher…</option><option value="0">Hoje</option><option value="6">Últimos 7 dias</option><option value="29">Últimos 30 dias</option><option value="89">Últimos 90 dias</option><option value="mes">Este mês</option><option value="mesp">Mês passado</option><option value="ano">Este ano</option><option value="365">Últimos 12 meses</option><option value="tudo">Todo o histórico</option></select></label>
    <label>De <input type="date" id="fDe"></label>
    <label>Até <input type="date" id="fAte"></label>
    <label>Linha <input id="fLinha" list="dlLinhas" placeholder="Todas"></label>
    <label>Turno <select id="fTurno"><option value="">Todos</option></select></label>
    <label>Sentido <select id="fSent"><option value="">IDA e VOLTA</option><option>IDA</option><option>VOLTA</option></select></label>
    <button class="btn p" id="bAtual" style="align-self:flex-end">Atualizar</button>
    <button class="btn" id="bLimpar" style="align-self:flex-end" title="Volta Linha, Turno e Sentido para Todos">✕ Limpar filtros</button>
    <button class="btn" id="bCsv" style="align-self:flex-end">⬇ Baixar Excel</button>
  </div>
  <datalist id="dlLinhas"></datalist>
  <div id="coleta" class="faixa warn hidden"></div>

  <div id="painel"></div>
</div>
<div id="ov" class="ov hidden"><div class="dlg"><h2><span id="ovT"></span><span class="r"><button class="btn sm" id="ovCsv">⬇ Excel</button><button class="btn sm" id="ovX">Fechar</button></span></h2><div class="note" id="ovS"></div><div id="ovC"></div></div></div>

<script src="../rota/leaflet.js"></script>
<script>
const SB_URL="https://orhuxmsrdnugpogvtnbg.supabase.co";
const SB_KEY="sb_publishable_Hu4Ns0jDTesWzDmVseAl_Q_ubCJa5wL";
const MAPTILER_KEY="G2MUHW7Q8hatR3VYbHUz";
const K_SESS="tf_bi", K_CENTRAL="tf_sessao", K_SOL="tf_solicitacoes", K_TAB="tf_bi_aba";
const CENTRO=[-3.2474,-47.7368];   // terminal da mina (ponto de chegada mais comum nas viagens)
let TOKEN=null,QUEM=null,INI=null,ABA=null,DADOS=null,OPC=null,CSV=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const nf=n=>n==null?"—":Number(n).toLocaleString("pt-BR");
const brl=n=>n==null?"—":Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dBR=s=>s?String(s).slice(0,10).split("-").reverse().join("/"):"—";
const dCurto=s=>s?String(s).slice(5,10).split("-").reverse().join("/"):"";
const dtBR=s=>{if(!s)return"";const d=new Date(s);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};
const hoje=()=>new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
const menosDias=(d,n)=>new Date(Date.parse(d+"T12:00:00Z")-n*864e5).toISOString().slice(0,10);
const nomeCurto=n=>String(n||"?").toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
const hm2min=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||"");return m?(+m[1])*60+(+m[2]):null};
const min2hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
function msg(id,t,cl){const m=$(id);if(m){m.textContent=t;m.className="msg "+(cl||"")}}

async function rpc(fn,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&(j.message||j.hint))||t||("Erro "+r.status);if(/sessao/.test(m)){ls.del(K_SESS);mostrarLogin();throw new Error("Sessão expirada, entre de novo.")}throw new Error(m)}
  return j;
}

/* ---------------- entrar ---------------- */
async function iniciar(){
  // sempre abre no dia de hoje (Horários, grupo ADM — ver entrar)
  $("fAte").value=hoje();$("fDe").value=hoje();$("fPer").value="0";
  const cand=[ls.get(K_SESS),ls.get(K_CENTRAL),ls.get(K_SOL)].filter(s=>s&&s.token);
  for(const s of cand){try{const q=await rpc("bi_sessao",{p_token:s.token});if(q&&!q.erro){entrar(s.token);return}}catch(e){}}
  mostrarLogin();
}
function mostrarLogin(){$("vApp").classList.add("hidden");$("vLogin").classList.remove("hidden");$("lSenha").focus()}
$("fLogin").onsubmit=async e=>{e.preventDefault();msg("lMsg","Entrando…");
  try{const r=await rpc("bi_entrar",{p_senha:$("lSenha").value});
    if(r.erro){msg("lMsg",r.erro,"err");return}
    ls.set(K_SESS,{token:r.token,nome:r.nome});entrar(r.token);
  }catch(err){msg("lMsg","Erro: "+err.message,"err")}};
$("bSair").onclick=async()=>{try{await rpc("bi_sair",{p_token:TOKEN})}catch(e){}ls.del(K_SESS);location.reload()};

async function entrar(tk){
  TOKEN=tk;$("vLogin").classList.add("hidden");$("vApp").classList.remove("hidden");
  try{INI=await rpc("bi_inicio",{p_token:TOKEN});QUEM=INI.quem}catch(err){$("painel").innerHTML='<div class="vazio">Erro: '+esc(err.message)+'</div>';return}
  $("who").textContent=QUEM.nome||"";
  const col=INI.coleta?new Date(INI.coleta):null,atraso=col?(Date.now()-col)/36e5:99;
  $("coleta").classList.toggle("hidden",atraso<2);
  $("coleta").textContent=col?"⚠ A coleta da TFleet está parada desde "+dtBR(INI.coleta)+": viagens e embarques depois disso ainda não entram aqui.":"⚠ Ainda não há viagens coletadas da TFleet.";
  const montaTurno=tl=>{const atual=$("fTurno").value;
    $("fTurno").innerHTML='<option value="">Todos</option>'+(GRUPOS().length?'<optgroup label="Grupos (Gerenciar)">'+GRUPOS().map(g=>'<option value="G:'+esc(g.nome)+'">'+esc(g.nome)+'</option>').join("")+'</optgroup><optgroup label="Turnos da TFleet">':'')+(tl||[]).map(t=>'<option>'+esc(t)+'</option>').join("")+(GRUPOS().length?'</optgroup>':'');
    $("fTurno").value=atual;if($("fTurno").value!==atual)$("fTurno").value=""};
  // ao abrir: Horários de entrada e saída, grupo ADM, hoje
  montaTurno([]);
  if(abasVisiveis().some(x=>x.id==="horarios"))ABA="horarios";
  padraoAba(ABA);
  rpc("bi_opcoes",{p_token:TOKEN}).then(o=>{OPC=o;
    $("dlLinhas").innerHTML=(o.linhas||[]).map(l=>'<option value="'+esc(l)+'">').join("");
    montaTurno(o.tipolinhas);
  }).catch(()=>{});
  montarAbas();
}
// filtros com que cada aba abre: Horários = grupo ADM, hoje; Roteirização = últimos 7 dias, tudo liberado
function padraoAba(id){
  if(id==="horarios"){const g=GRUPOS().find(g=>g.nome.trim().toUpperCase()==="ADM");
    $("fTurno").value=g?"G:"+g.nome:"";$("fLinha").value="";$("fSent").value="";$("fAte").value=hoje();$("fDe").value=hoje();$("fPer").value="0"}
  else if(id==="mapa_rotas"){$("fTurno").value="";$("fLinha").value="";$("fSent").value="";$("fAte").value=hoje();$("fDe").value=menosDias(hoje(),6);$("fPer").value="6"}
  else if(id==="roteiro"){$("fTurno").value="";$("fLinha").value="";$("fSent").value="";$("fAte").value=hoje();$("fDe").value=menosDias(hoje(),6);$("fPer").value="6"}
}
function abasVisiveis(){
  const p=(INI.paineis||[]).filter(x=>x.situacao!=="excluido");
  const a=p.map(x=>({id:x.id,titulo:x.titulo,sit:x.situacao}));
  a.push({id:"cercas",titulo:"Cercas dos turnos"});
  if(QUEM.edita)a.push({id:"gerenciar",titulo:"⚙ Gerenciar"});
  return a;
}
function montarAbas(){
  const a=abasVisiveis();
  const salvo=ls.get(K_TAB);ABA=a.find(x=>x.id===(ABA||salvo))?(ABA||salvo):(a[0]&&a[0].id);
  $("tabs").innerHTML=a.map(x=>'<button class="tab'+(x.id===ABA?" on":"")+'" data-id="'+x.id+'">'+esc(x.titulo)+(x.sit==="admin"?'<span class="tag">só admin</span>':'')+'</button>').join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ABA=b.dataset.id;ls.set(K_TAB,ABA);padraoAba(ABA);montarAbas()});
  carregar();
}
function filtros(){return{linha:$("fLinha").value.trim()||null,tipolinha:$("fTurno").value||null,sentido:$("fSent").value||null}}
$("bAtual").onclick=()=>carregar();
$("fPer").onchange=()=>{const v=$("fPer").value,h=hoje();if(!v)return;let de=h,ate=h;
  if(/^\d+$/.test(v))de=menosDias(h,+v);
  else if(v==="mes")de=h.slice(0,8)+"01";
  else if(v==="mesp"){const d=new Date(Date.parse(h.slice(0,8)+"01T12:00:00Z")-864e5);ate=d.toISOString().slice(0,10);de=ate.slice(0,8)+"01"}
  else if(v==="ano")de=h.slice(0,5)+"01-01";
  else if(v==="tudo")de=(INI&&INI.primeiro_dia)||menosDias(h,365);
  $("fDe").value=de;$("fAte").value=ate;carregar()};
["fDe","fAte"].forEach(i=>$(i).addEventListener("change",()=>{$("fPer").value=""}));
["fDe","fAte","fTurno","fSent"].forEach(i=>$(i).addEventListener("change",()=>carregar()));
$("fLinha").addEventListener("change",()=>carregar());
$("bLimpar").addEventListener("click",()=>{$("fLinha").value="";$("fTurno").value="";$("fSent").value="";carregar()});

async function carregar(){
  const semFiltro=ABA==="cercas"||ABA==="gerenciar";
  $("filtros").classList.toggle("hidden",semFiltro);
  CSV=null;
  if(ABA==="cercas")return telaCercas();
  if(ABA==="gerenciar")return telaGerenciar();
  if(!ABA){$("painel").innerHTML='<div class="vazio">Nenhum painel liberado para você.</div>';return}
  limpaMapas();
  $("painel").innerHTML='<div class="vazio">Carregando…</div>';
  if(ABA==="viagens"&&$("fAte").value&&$("fDe").value&&(Date.parse($("fAte").value)-Date.parse($("fDe").value))/864e5<6){
    $("fDe").value=menosDias($("fAte").value,29);$("fPer").value="";}
  const de=$("fDe").value,ate=$("fAte").value;
  try{
    let aviso="";
    if(ABA==="horarios"||ABA==="roteiro")aviso=await processarCercas(de,ate);
    DADOS=await rpc("bi_dados",{p_token:TOKEN,p_painel:ABA,p_de:de,p_ate:ate,p_filtros:filtros()});
    if(ABA==="horarios"){HM=null;try{HM=await rpc("bi_horarios_motorista",{p_token:TOKEN,p_de:de,p_ate:ate})}catch(e){HM=null}juntaMot(DADOS.linhas||[])}
    ({ocupacao:telaOcupacao,horarios:telaHorarios,roteiro:telaRoteiro,fora_rota:telaFora,viagens:telaViagens,custo:telaCusto,nao_cad:telaNaoCad,mapa_rotas:telaMapaRotas}[ABA]||(()=>{}))(DADOS);
    if(aviso)$("painel").insertAdjacentHTML("afterbegin",'<div class="note" style="color:#b45309">'+esc(aviso)+'</div>');
  }catch(err){$("painel").innerHTML='<div class="vazio">Erro: '+esc(err.message)+'</div>'}
}
async function processarCercas(de,ate){
  let aviso="";
  for(let i=0;i<80;i++){
    let r;
    try{r=await rpc("bi_processar",{p_token:TOKEN,p_de:de,p_ate:ate,p_max:i?2:1})}
    catch(e){
      // tempo esgotado: tenta de novo com 1 dia por vez; se insistir, mostra o que já foi calculado
      try{r=await rpc("bi_processar",{p_token:TOKEN,p_de:de,p_ate:ate,p_max:1})}
      catch(e2){aviso="Parte dos dias ainda não foi calculada ("+e2.message+"). Clique em Atualizar para continuar.";break}
    }
    if(!r||!r.falta)break;
    $("painel").innerHTML='<div class="vazio">Calculando entradas e saídas nas cercas pelo GPS do Monitor… faltam '+r.falta+' dia(s).</div>';
  }
  return aviso;
}

/* ---------------- peças de desenho ---------------- */
const kpi=(v,l,s,cl,dr)=>'<div class="kpi '+(cl||"")+(dr?' dr" title="clique para ver o detalhe"'+drA(dr.t,dr.c,dr.v):'"')+'><b>'+v+'</b><span>'+esc(l)+'</span>'+(s?'<small>'+esc(s)+'</small>':'')+'</div>';
const drA=(t,c,v)=>' data-dt="'+esc(t)+'" data-dc="'+esc(c)+'" data-dv="'+esc(v)+'"';
function barras(lista,rot,val,fmt,max,dr){
  lista=(lista||[]).slice(0,max||30);const mx=Math.max(1,...lista.map(x=>+x[val]||0));fmt=fmt||nf;
  if(!lista.length)return'<div class="note">Sem dados no período.</div>';
  return'<table class="rk">'+lista.map(x=>'<tr'+(dr?' class="dr"'+drA(dr.t,dr.c,x[dr.k]):'')+' title="'+(dr?"clique para ver o detalhe":"")+'"><td>'+esc(typeof rot==="function"?rot(x):x[rot])+'<div class="barra"><i style="width:'+(100*(+x[val]||0)/mx).toFixed(1)+'%"></i></div></td><td class="n">'+fmt(x[val])+'</td></tr>').join("")+'</table>';
}
// colunas por dia (SVG simples)
function colunasDia(lista,campo,cor,dr,ideal){
  if(!lista||!lista.length)return'<div class="note">Sem dados no período.</div>';
  ideal=+ideal||0;let porMes=false;
  if(lista.length>92){// período longo: uma barra por mês com a média por dia
    const g={};lista.forEach(x=>{const m=String(x.dia).slice(0,7);(g[m]=g[m]||{dia:m+"-01",s:0,n:0});g[m].s+=+x[campo]||0;g[m].n++});
    lista=Object.values(g).sort((a,b)=>a.dia.localeCompare(b.dia)).map(m=>({dia:m.dia,[campo]:Math.round(10*m.s/m.n)/10,_dias:m.n}));porMes=true;dr=null}
  const mx=Math.max(1,ideal,...lista.map(x=>+x[campo]||0))*1.12,n=lista.length,rot=n<=20?1:Math.ceil(n/20),mostraV=n<=45;
  const media=lista.reduce((a,x)=>a+(+x[campo]||0),0)/n;
  let h='<div class="colw"><div class="plot" style="min-width:'+(n*12)+'px">';
  [.25,.5,.75,1].forEach(f=>h+='<div class="grade" style="bottom:'+(f*100)+'%"><span>'+nf(Math.round(mx*f))+'</span></div>');
  lista.forEach((x,i)=>{const v=+x[campo]||0,baixo=ideal&&v<ideal;
    h+='<div class="c'+(dr?' dr':'')+'"'+(dr?drA(dr.t,dr.c,x.dia)+(dr.t2?' data-dc2="'+esc(dr.c2)+'" data-dv2="'+esc(dr.v2)+'"':''):'')+' title="'+esc((porMes?"mês "+x.dia.slice(5,7)+"/"+x.dia.slice(0,4)+" ("+x._dias+" dias), média por dia":dBR(x.dia))+': '+nf(v)+(ideal?' (ideal '+ideal+')':'')+(dr?' · clique para ver':''))+'">'
      +(mostraV?'<b>'+nf(v)+'</b>':'')+'<i style="height:'+(100*v/mx).toFixed(1)+'%;background:'+(baixo?"#f59e0b":(cor||"#2563eb"))+'"></i></div>'});
  if(ideal)h+='<div class="ideal" style="bottom:'+(100*ideal/mx).toFixed(1)+'%"></div>';
  h+='</div><div class="eixo" style="min-width:'+(n*12)+'px">'+lista.map((x,i)=>'<span>'+(i%rot===0?(porMes?x.dia.slice(5,7)+"/"+x.dia.slice(2,4):dCurto(x.dia)):'')+'</span>').join("")+'</div></div>'
    +'<div class="note">'+(porMes?'Período longo: cada barra é um mês, com a média por dia. Para clicar e ver as viagens, escolha até 3 meses. · ':'')+n+(porMes?' mês(es)':' dia(s)')+' · média '+nf(Math.round(media*10)/10)+' por dia'+(ideal?' · linha tracejada = ideal '+nf(ideal)+' · '+lista.filter(x=>(+x[campo]||0)<ideal).length+(porMes?' mês(es)':' dia(s)')+' abaixo do ideal (barra laranja)':'')+'</div>';
  return h;
}
// tabela com ordenação por clique no título; guarda os dados para o botão Baixar Excel
function tabela(id,cols,linhas,nome,rowDr){
  CSV={cols,linhas,nome};
  const st={k:null,d:1};
  const pinta=()=>{
    let l=linhas.slice();if(st.k){const c=cols.find(c=>c.k===st.k);l.sort((a,b)=>{const x=a[st.k],y=b[st.k];return(c.num?(+x||0)-(+y||0):String(x??"").localeCompare(String(y??""),"pt-BR"))*st.d})}
    const mostra=l.slice(0,800);
    $(id).innerHTML='<div class="tb scroll"><table class="dt"><thead><tr>'+cols.map(c=>'<th data-k="'+c.k+'">'+esc(c.t)+(st.k===c.k?(st.d>0?" ▲":" ▼"):"")+'</th>').join("")+'</tr></thead><tbody>'
      +(mostra.length?mostra.map(r=>{const d=rowDr&&rowDr(r);return'<tr'+(d?' class="dr" title="clique para ver o detalhe"'+drA(d.t,d.c,d.v):'')+'>'+cols.map(c=>'<td class="'+(c.num?"n":"")+(c.w?" w":"")+'">'+(c.f?c.f(r[c.k],r):esc(r[c.k]??"—"))+'</td>').join("")+'</tr>'}).join(""):'<tr><td colspan="'+cols.length+'" class="note">Nada no período.</td></tr>')
      +'</tbody></table></div>'+(l.length>800?'<div class="note">Mostrando 800 de '+nf(l.length)+'. O Excel leva todas.</div>':'');
    $(id).querySelectorAll("th").forEach(th=>th.onclick=()=>{st.d=st.k===th.dataset.k?-st.d:1;st.k=th.dataset.k;pinta()});
  };pinta();
}
$("bCsv").onclick=()=>{
  if(!CSV){alert("Este painel não tem tabela para baixar.");return}
  const q=v=>{v=v==null?"":String(v);return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const txt="﻿"+CSV.cols.map(c=>q(c.t)).join(";")+"\n"+CSV.linhas.map(r=>CSV.cols.map(c=>{let v=r[c.k];if(c.num&&v!=null)v=String(v).replace(".",",");return q(v)}).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  a.download=(CSV.nome||"bi")+"_"+$("fDe").value+"_a_"+$("fAte").value+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};

  const f=filtros();if(c2==="turno")f.tipolinha=v2;if(ABA==="viagens")f.so_turnos_viagens="sim";

  $("ovS").textContent="Carregando…";$("ovC").innerHTML="";$("ov").classList.remove("hidden");
  CSV_TELA=CSV;
  try{const r=await rpc("bi_detalhe",{p_token:TOKEN,p_tipo:t,p_de:de,p_ate:ate,p_filtros:f,p_campo:c,p_valor:v});

// faixas de ocupação (mesmas cores em todo o painel)
const FX=[{k:"vazias",t:"Sobrando lugar",d:"menos de 50% dos lugares",c:"#f59e0b"},{k:"boas",t:"Boa",d:"de 50% a 88%",c:"#16a34a"},
          {k:"cheias",t:"Cheia",d:"89% ou mais",c:"#f97316"},{k:"lotadas",t:"Lotada",d:"todos os lugares ocupados",c:"#dc2626"}];
const corPct=(v,lug,med)=>v==null?"#94a3b8":(med!=null&&lug&&med>=lug)||v>=100?"#dc2626":v>=89?"#f97316":v>=50?"#16a34a":"#f59e0b";
function barraFaixas(f){
  const tot=FX.reduce((a,x)=>a+(+f[x.k]||0),0);if(!tot)return'<div class="note">Nenhuma viagem com leitura de passageiros no período.</div>';
  return'<div style="display:flex;height:34px;border-radius:8px;overflow:hidden;margin:6px 0 10px">'+FX.map(x=>{const n=+f[x.k]||0,pc=100*n/tot;
      return n?'<div class="dr"'+drA("viagens","faixa",x.k)+' title="'+esc(x.t+": "+n+" viagens ("+Math.round(pc)+"%) · clique para ver")+'" style="width:'+pc.toFixed(2)+'%;background:'+x.c+';color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden">'+(pc>=6?Math.round(pc)+"%":"")+'</div>':''}).join("")+'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px">'+FX.map(x=>'<div class="dr"'+drA("viagens","faixa",x.k)+' title="clique para ver as viagens"><b style="color:'+x.c+'">● '+esc(x.t)+'</b> · '+nf(+f[x.k]||0)+' viagem(ns)<div class="note">'+esc(x.d)+'</div></div>').join("")+'</div>';
}
// ocupação média por dia em %, cor pela faixa, linha em 100%
function colunasPct(lista,lug){
  if(!lista||!lista.length)return'<div class="note">Nenhuma viagem com leitura de passageiros no período.</div>';
  const mx=Math.max(110,...lista.map(x=>+x.pct||0)),n=lista.length,rot=n<=20?1:Math.ceil(n/20),mostraV=n<=45;
  let h='<div class="colw"><div class="plot" style="min-width:'+(n*12)+'px">';
  [50,100].forEach(f=>h+='<div class="grade" style="bottom:'+(100*f/mx)+'%"><span>'+f+'%</span></div>');
  lista.forEach(x=>{const v=+x.pct||0;h+='<div class="c dr"'+drA("viagens","dia",x.dia)+' title="'+esc(dBR(x.dia)+": ocupação média "+nf(v)+"% ("+nf(x.media)+" de "+lug+" lugares) em "+x.viagens+" viagens"+(x.lotadas?", "+x.lotadas+" lotada(s)":"")+" · clique para ver")+'">'
    +(mostraV?'<b>'+Math.round(v)+'%</b>':'')+'<i style="height:'+(100*v/mx).toFixed(1)+'%;background:'+corPct(v)+'"></i></div>'});
  h+='<div class="ideal" style="bottom:'+(100*100/mx).toFixed(1)+'%;border-color:#dc2626"></div>';
  return h+'</div><div class="eixo" style="min-width:'+(n*12)+'px">'+lista.map((x,i)=>'<span>'+(i%rot===0?dCurto(x.dia):'')+'</span>').join("")+'</div></div>'
    +'<div class="note">Em cima da barra: <b>% dos lugares ocupados</b>, em média, nas viagens do dia (não é número de pessoas). Junta todas as rotas do filtro; para ver uma rota só, escolha a Linha no filtro ou clique nela em "Ocupação por linha". Linha vermelha = ônibus cheio (100%).</div>';
}
// ocupação por linha: barra horizontal em %, ordenada da mais cheia para a mais vazia
function linhasPct(lista,lug){
  const L=(lista||[]).filter(x=>x.pct!=null).sort((a,b)=>b.pct-a.pct);if(!L.length)return'<div class="note">Sem leitura de passageiros nas viagens do período.</div>';
  const mx=Math.max(100,...L.map(x=>x.pct));
  return'<div class="scroll" style="max-height:440px;overflow:auto"><table class="rk">'+L.map(x=>'<tr class="dr"'+drA("viagens","linha",x.linha)+' title="clique para ver as viagens"><td style="width:38%">'+esc(x.linha)+'</td><td>'
    +'<div style="position:relative;height:18px;background:var(--card2);border-radius:4px"><i style="position:absolute;left:0;top:0;bottom:0;width:'+(100*x.pct/mx).toFixed(1)+'%;background:'+corPct(x.pct)+';border-radius:4px"></i>'
    +'<i style="position:absolute;top:-2px;bottom:-2px;left:'+(100*100/mx).toFixed(1)+'%;border-left:2px dashed #dc2626"></i></div></td>'
    +'<td class="n" style="width:150px">'+nf(x.pct)+'% <span class="note" style="font-weight:400">'+nf(x.media_ocup)+' de '+lug+'</span></td></tr>').join("")+'</table></div>'
    +'<div class="note">Tracejado vermelho = todos os '+lug+' lugares ocupados. Média das viagens que tiveram leitura de passageiros.</div>';
}
const STX={"REGULAR":"embarcou na própria linha de cadastro","NAO CADASTRADO":"crachá lido, mas a pessoa não está cadastrada em nenhuma linha","ITINERANTE":"cadastrado, mas usando outra linha (fora de rota)","INATIVO":"cadastro desativado na TFleet","SEM STATUS":"a TFleet não informou"};

  const tl=Object.values(turnos).sort((a,b)=>b.n-a.n);

      +'Só entram na conta as viagens em que a TFleet leu os crachás.</div>'

    +kpi(k.media_ocup==null?"—":nf(k.media_ocup),"passageiros por viagem","em média, de "+lug+" lugares",null,{t:"viagens",c:"com_leitura",v:"com leitura de passageiros"})
    +kpi(k.pct==null?"—":nf(k.pct)+"%","ocupação média",k.pct==null?"":"de cada 10 lugares, "+nf(Math.round(k.pct/10))+" ocupados",k.pct>=89?"bad":k.pct<50?"warn":"ok",{t:"viagens",c:"com_leitura",v:"com leitura de passageiros"})+'</div>'
    +'<div class="box"><h3>Como estão as viagens</h3><div class="note">Cada viagem entra numa faixa pela quantidade de passageiros.</div>'+barraFaixas(d.faixas||{})+'</div>'

    +'<div class="box"><h3>Ocupação por linha <span class="r note">da mais cheia para a mais vazia · clique para ver as viagens</span></h3>'+linhasPct(d.por_linha,lug)

    +'<div class="box"><h3>Onde os passageiros embarcam <span class="r note">cada bolinha junta os embarques num raio de ~10 m · clique para ver as linhas</span></h3>'
    +'<div style="margin-bottom:6px"><label>Rotas do mapa gerencial <select id="ocRota"></select></label> <span class="note" id="ocRotaN"></span></div>'
    +'<div id="mOcup" style="height:460px;border-radius:8px"></div><div class="note" style="margin-top:6px"><b style="color:#38bdf8">●</b> poucos <b style="color:#facc15">●</b> <b style="color:#f97316">●</b> <b style="color:#dc2626">●</b> muitos embarques'
    +(d.sem_gps?' · '+nf(d.sem_gps)+' embarque(s) fora de Paragominas/mina e Tomé-Açu (ou sem GPS) não aparecem':'')+'. Para comparar com os pontos oficiais, use a aba <b>Mapa das rotas</b>.</div></div>'
    +'<div class="cols3"><div class="box"><h3>Quem são os passageiros</h3>'
      +st.map(x=>'<div class="dr" style="padding:6px 0;border-top:1px solid var(--line)"'+drA("embarques","status",x.status)+' title="clique para ver quem embarcou"><b>'+esc(x.status)+'</b> · '+nf(x.n)+' ('+(stT?Math.round(100*x.n/stT):0)+'%)<div class="note">'+esc(STX[x.status]||"")+'</div>'

const minLocal=iso=>{const d=new Date(Date.parse(iso)-3*3600e3);return d.toISOString().slice(11,16)};
function distKm(a,b){const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function dentroPoli(p,poly){let d=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];
  if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])d=!d}return d}
function distCerca(p,poly){if(!poly||poly.length<3)return null;if(dentroPoli(p,poly))return 0;
  // distância até a borda (aproximada pelos lados do polígono)
  let m=1e9;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[j],b=poly[i];for(let t=0;t<=1;t+=.05)m=Math.min(m,distKm(p,[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]))}return m}

function graficoFaixas(L){
  if(!L.length)return'<div class="note">Nenhuma viagem com hora nesse período e filtro.</div>';
  const g={};L.forEach(x=>{const k=x.linha+"|"+x.prevista+"|"+x.tol_antes+"|"+x.tol_depois;(g[k]=g[k]||{linha:x.linha,prev:hm2min(x.prevista),ta:x.tol_antes,td:x.tol_depois,p:[]}).p.push(x)});
  const rows=Object.values(g).sort((a,b)=>a.prev-b.prev||a.linha.localeCompare(b.linha)).slice(0,40);
  let lo=1e9,hi=-1e9;rows.forEach(r=>{const base=r.prev;lo=Math.min(lo,base-r.ta);hi=Math.max(hi,base+r.td);r.p.forEach(x=>{const v=base+x.dif;lo=Math.min(lo,v);hi=Math.max(hi,v)})});
  lo=Math.floor((lo-5)/15)*15;hi=Math.ceil((hi+5)/15)*15;
  const LW=190,W=900,RH=22,H=rows.length*RH+26,sx=v=>LW+(W-LW-10)*(v-lo)/Math.max(1,hi-lo);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:560px" role="img">';
  const passo=(hi-lo)>360?60:(hi-lo)>120?30:15;
  for(let t=lo;t<=hi;t+=passo)s+='<line x1="'+sx(t)+'" x2="'+sx(t)+'" y1="0" y2="'+(H-20)+'" stroke="#e4e8f0"/><text x="'+sx(t)+'" y="'+(H-6)+'" text-anchor="middle">'+min2hm(t)+'</text>';
  rows.forEach((r,i)=>{const y=i*RH+RH/2+2;
    s+='<text x="'+(LW-6)+'" y="'+(y+4)+'" text-anchor="end">'+esc(r.linha.length>28?r.linha.slice(0,27)+"…":r.linha)+'</text>';
    s+='<rect x="'+sx(r.prev-r.ta)+'" y="'+(y-6)+'" width="'+(sx(r.prev+r.td)-sx(r.prev-r.ta))+'" height="12" rx="3" fill="#cbd5e1"/>';

    r.p.forEach(x=>{s+='<circle cx="'+sx(r.prev+x.dif)+'" cy="'+y+'" r="4.5" fill="'+(STCOR[x.status]||"#64748b")+'" stroke="#fff" stroke-width="1.5"'+(x.origem==="Monitor"?'':' fill-opacity=".55"')+'><title>'+esc(dBR(x.data)+" · carro "+x.frota+" · "+x.hora_real+" ("+x.origem+") · "+(x.dif>0?"+":"")+x.dif+" min")+'</title></circle>'});
  });
  return'<div class="tb">'+s+'</svg></div>'+(Object.keys(g).length>40?'<div class="note">Mostrando 40 rotas. Use o filtro de linha ou turno para ver as outras.</div>':'')
    +'<div class="note">Ponto cheio = medido pela cerca (Monitor); ponto claro = hora da TFleet.</div>';
}

// distância em metros (aproximação plana, boa para poucos km) e até um trecho da rota
const mXY=(la,lo,la0)=>[lo*111320*Math.cos(la0*Math.PI/180),la*110540];
function dPonto(a,b){const p=mXY(a[0],a[1],a[0]),q=mXY(b[0],b[1],a[0]);return Math.hypot(p[0]-q[0],p[1]-q[1])}
function dTracado(a,pts){let mn=Infinity;for(let i=0;i<pts.length-1;i++){
  const p=mXY(a[0],a[1],a[0]),u=mXY(pts[i][0],pts[i][1],a[0]),v=mXY(pts[i+1][0],pts[i+1][1],a[0]);
  const dx=v[0]-u[0],dy=v[1]-u[1],L2=dx*dx+dy*dy;let t=L2?((p[0]-u[0])*dx+(p[1]-u[1])*dy)/L2:0;t=Math.max(0,Math.min(1,t));

  return pts.length===1?dPonto(a,pts[0]):mn}

const nmL=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/\s*-\s*PASSAGEIRO\s*$/,"").replace(/\s*-\s*/g," - ").replace(/\s+/g," ").trim();
const corN=(n,mx)=>{const f=Math.min(1,Math.log(1+n)/Math.log(1+mx));return f>.75?"#dc2626":f>.5?"#f97316":f>.25?"#facc15":"#38bdf8"};
let MAPA_OC=null;
// Leaflet: redesenho pendente do canvas depois que o mapa foi removido (troca de aba) dava erro; ignora
{const r0=L.Canvas.prototype._redraw;L.Canvas.prototype._redraw=function(){if(this._ctx)return r0.apply(this,arguments)}}
// tira os mapas do Leaflet antes de trocar o painel (senão ele tenta redesenhar num mapa que sumiu)
function limpaMapas(){[MAPA_OC,MAPA_MR,mapaFora].forEach(m=>{if(m)try{m.remove()}catch(e){}});MAPA_OC=MAPA_MR=mapaFora=null}

let MR=null,MR_ROTA="",MR_RAIO=150,MR_DESV=300,MAPA_MR=null;

const termos=x=>String(x||"").split(",").map(t=>t.trim().toUpperCase()).filter(Boolean);

  if(!T.length&&!inc.length)return false;if(T.length&&!T.includes(String(tl||"").toUpperCase().trim()))return false;
  if(inc.length&&!inc.some(t=>temT(linha,t)))return false;
  if((f.fora||[]).some(x=>x.toUpperCase().trim()===String(linha||"").toUpperCase().trim()))return false;return!exc.some(t=>temT(linha,t))}

    +'<div class="note" style="margin-top:6px">'+RT.itens.length+' cerca(s) nesta roteirização. Em cada uma: nome, horário que o carro deve passar na ida e na volta, e o desenho no mapa.</div>'
    +'<div id="rItens">'+RT.itens.map((it,i)=>'<div class="regra" data-it="'+i+'" style="'+(i===RT.sel?'border-color:#2563eb;background:#eff6ff':'')+'">'
      +'<div style="display:flex;gap:6px;align-items:center"><b style="font-size:13px">Cerca '+(i+1)+'</b><span class="note">'+(it.pontos.length>=3?it.pontos.length+' pontos ✔':'<span style="color:#b45309">falta desenhar</span>')+'</span>'
      +'<button class="btn sm'+(i===RT.sel?' p':'')+'" data-sel="'+i+'" style="margin-left:auto">✏ Desenhar</button><button class="btn sm" data-lp="'+i+'" title="Limpar o desenho">↺</button><button class="btn sm red" data-rmi="'+i+'">✕</button></div>'
      +'<div class="g"><label>Nome<input data-f="nome" value="'+esc(it.nome)+'" placeholder="Ex.: Saída Alagoas"></label><label>Passa na ida<input type="time" data-f="ida" value="'+esc(it.ida)+'"></label><label>Passa na volta<input type="time" data-f="volta" value="'+esc(it.volta)+'"></label></div></div>').join("")+'</div>'
    +'<div style="display:flex;gap:6px;margin-top:6px"><span class="note" id="nPts"></span><button class="btn sm" id="bDesf">Desfazer ponto</button></div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" id="rCanc">Cancelar</button><button class="btn p" id="rSalv">Salvar roteirização</button></div><div id="rMsg" class="msg"></div></div>';
  $("rCor").oninput=()=>{RT.cor=$("rCor").value;ED.cor=RT.cor;desenharEd()};
  $("lado").querySelectorAll("[data-rot]").forEach(x=>x.onchange=()=>{const k=x.dataset.rot==="ida"?"rotas_ida":"rotas_volta";
    RT[k]=RT[k].filter(l=>l!==x.value);if(x.checked)RT[k].push(x.value);$("rc_"+x.dataset.rot).textContent=RT[k].length+" marcada(s)"});
  $("lado").querySelectorAll("[data-busca]").forEach(b=>b.oninput=()=>{const t=b.value.trim().toUpperCase();
    $("lado").querySelectorAll('[data-lst="'+b.dataset.busca+'"] label').forEach(l=>l.style.display=!t||l.dataset.nm.includes(t)||l.querySelector("input").checked?"":"none")});
  $("bDesf").onclick=()=>{ED.pontos.pop();desenharEd();lerRot();formRot();desenharEd()};
  $("rAplic").onclick=()=>{lerRot();const n=Math.max(1,Math.min(30,+$("rQtd").value||1));
    while(RT.itens.length<n)RT.itens.push({id:null,nome:"",ida:"",volta:"",pontos:[]});
    while(RT.itens.length>n){const x=RT.itens.pop();if(x.id)RT.removidos.push(x.id)}
    RT.sel=Math.min(RT.sel,n-1);ED=RT.itens[RT.sel];ED.cor=RT.cor;formRot();desenharEd()};
  $("rItens").querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{lerRot();RT.sel=+b.dataset.sel;ED=RT.itens[RT.sel];ED.cor=RT.cor;formRot();desenharEd();
    if(mapa&&ED.pontos.length>=3)mapa.fitBounds(ED.pontos,{padding:[40,40],maxZoom:18})});
  $("rItens").querySelectorAll("[data-lp]").forEach(b=>b.onclick=()=>{lerRot();RT.itens[+b.dataset.lp].pontos.length=0;formRot();desenharEd()});
  $("rItens").querySelectorAll("[data-rmi]").forEach(b=>b.onclick=()=>{lerRot();if(RT.itens.length<=1)return;const x=RT.itens.splice(+b.dataset.rmi,1)[0];if(x.id)RT.removidos.push(x.id);
    RT.sel=Math.min(RT.sel,RT.itens.length-1);ED=RT.itens[RT.sel];ED.cor=RT.cor;formRot();desenharEd()});
  $("rCanc").onclick=()=>{RT=null;ED=null;listaCercas()};
  $("rSalv").onclick=async()=>{lerRot();
    if(!RT.nome){msg("rMsg","Dê um nome para a roteirização.","err");return}
    if(!RT.rota_ida&&!RT.rotas_ida.length&&!RT.rotas_volta.length){msg("rMsg","Marque as rotas da ida (e da volta) na lista.","err");return}
    if(RT.nomeAntigo!==RT.nome&&ROT_GRUPOS[RT.nome]){msg("rMsg","Já existe uma roteirização com esse nome.","err");return}
    const falta=RT.itens.findIndex(it=>it.pontos.length<3);if(falta>=0){msg("rMsg","Desenhe a cerca "+(falta+1)+" no mapa (mínimo 3 pontos).","err");return}
    msg("rMsg","Salvando…");
    try{for(let i=0;i<RT.itens.length;i++){const it=RT.itens[i];
        await rpc("bi_cerca_salvar",{p_token:TOKEN,p_dados:{id:it.id,nome:it.nome||(RT.nome+" - cerca "+(i+1)),turno:"",finalidade:"roteiro",cor:RT.cor,ativo:true,pontos:it.pontos,
          horarios:[{roteiro:RT.nome,ordem:i+1,rota_ida:RT.rota_ida,rota_volta:RT.rota_volta,rotas_ida:RT.rotas_ida,rotas_volta:RT.rotas_volta,ida:it.ida,volta:it.volta,tol_antes:RT.tol_antes,tol_depois:RT.tol_depois}]}})}
      for(const id of RT.removidos)await rpc("bi_cerca_remover",{p_token:TOKEN,p_id:id});
      RT=null;ED=null;telaCercas()}catch(err){msg("rMsg",err.message,"err")}};
  const n=$("nPts");if(n)n.textContent="Cerca "+(RT.sel+1)+": "+ED.pontos.length+" ponto(s)";
}
function editar(c){RT=null;
  ED=c?JSON.parse(JSON.stringify(c)):{id:null,nome:"",turno:"",finalidade:"turno",cor:"#2563eb",ativo:true,pontos:[],horarios:[regraNova()]};
  ED.finalidade=ED.finalidade||"turno";
  if(!ED.horarios||!ED.horarios.length)ED.horarios=[regraNova()];
  $("mapaDica").textContent="Clique no mapa para marcar os cantos da cerca, na ordem, contornando a área. Mínimo 3 pontos.";
  formEd();desenharEd();
  if(mapa&&ED.pontos.length>=3)mapa.fitBounds(ED.pontos,{padding:[40,40],maxZoom:18});
}
function desenharEd(){
  if(!camada)return;camada.clearLayers();
  CERCAS.filter(c=>(!ED||c.id!==ED.id)&&!(RT&&RT.itens.some(it=>it.id===c.id))).forEach(c=>{if((c.pontos||[]).length>=3)L.polygon(c.pontos,{color:c.cor,weight:1,fillOpacity:.08,interactive:false}).addTo(camada)});
  if(RT)RT.itens.forEach((it,i)=>{if(it!==ED&&it.pontos.length>=3)L.polygon(it.pontos,{color:RT.cor,weight:2,fillOpacity:.15,dashArray:"5 4",interactive:false}).bindTooltip((i+1)+". "+(it.nome||"cerca "+(i+1)),{permanent:true,direction:"center",className:"lbl"}).addTo(camada)});
  if(!ED)return;
  if(ED.pontos.length>=3)L.polygon(ED.pontos,{color:ED.cor,weight:3,fillOpacity:.3,interactive:false}).addTo(camada);
  else if(ED.pontos.length===2)L.polyline(ED.pontos,{color:ED.cor,weight:3}).addTo(camada);
  ED.pontos.forEach((p,i)=>{const mk=L.marker(p,{draggable:true,icon:L.divIcon({className:"",html:'<div style="width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid '+esc(ED.cor)+'"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(camada);
    mk.on("dragend",e=>{const ll=e.target.getLatLng();ED.pontos[i]=[+ll.lat.toFixed(6),+ll.lng.toFixed(6)];desenharEd()});});
  const n=$("nPts");if(n)n.textContent=(RT?"Cerca "+(RT.sel+1)+": ":"")+ED.pontos.length+" ponto(s) marcados";
}
function formEd(){
  const tl=(OPC&&OPC.tipolinhas)||[];
  const rg=(h,i)=>'<div class="regra" data-i="'+i+'"><div style="display:flex;gap:6px;align-items:center"><b style="font-size:13px">Horário '+(i+1)+'</b>'
    +(ED.horarios.length>1?'<button class="btn sm red" data-rmr="'+i+'" style="margin-left:auto">Tirar</button>':'')+'</div>'
    +'<label>Nome do horário (ex.: Turno 01 manhã)</label><input data-f="rotulo" value="'+esc(h.rotulo)+'">'
    +'<label>Quais rotas este horário acompanha</label><select data-f="grupo" class="selGrupo">'+GRUPOS().map(g=>'<option'+(g.nome===h.grupo?" selected":"")+'>'+esc(g.nome)+'</option>').join("")+'<option value=""'+(!h.grupo?" selected":"")+'>Personalizado (escolher aqui)</option></select>'
    +(h.grupo?'':'<div class="chks" style="margin-top:6px">'+tl.map(t=>'<label><input type="checkbox" data-tl="'+esc(t)+'"'+((h.tipolinhas||[]).includes(t)?" checked":"")+'>'+esc(t)+'</label>').join("")+'</div>'
      +'<label>Nome da linha contém (separe por vírgula; ^CT = começa com CT)</label><input data-f="linha_contem" value="'+esc(h.linha_contem||"")+'">'
      +'<label>Nome da linha NÃO contém</label><input data-f="linha_exclui" value="'+esc(h.linha_exclui||"")+'">')
    +(h.rotas&&h.rotas.length||h._porRota?'':previaHor(h))
    +'<label>Horário</label><select class="selModo"><option value="1"'+(h.rotas&&h.rotas.length||h._porRota?'':" selected")+'>O mesmo horário para todas as rotas</option><option value="2"'+(h.rotas&&h.rotas.length||h._porRota?" selected":"")+'>Horário diferente para cada rota (medidas juntas)</option></select>'
    +(h.rotas&&h.rotas.length||h._porRota?tabRotas(h):'<div class="g"><label>Chegada prevista<input type="time" data-f="chegada" value="'+esc(h.chegada||"")+'"></label><label>Tolerância antes (min)<input type="number" min="0" data-f="cheg_antes" value="'+(h.cheg_antes??10)+'"></label><label>Tolerância depois (min)<input type="number" min="0" data-f="cheg_depois" value="'+(h.cheg_depois??10)+'"></label>'
    +'<label>Saída prevista<input type="time" data-f="saida" value="'+esc(h.saida||"")+'"></label><label>Tolerância antes (min)<input type="number" min="0" data-f="sai_antes" value="'+(h.sai_antes??10)+'"></label><label>Tolerância depois (min)<input type="number" min="0" data-f="sai_depois" value="'+(h.sai_depois??10)+'"></label></div>'
    +'<label>Dias</label><div class="chks">'+[1,2,3,4,5,6,7].map(d=>'<label><input type="checkbox" data-dia="'+d+'"'+((h.dias||[]).includes(d)?" checked":"")+'>'+DIAS[d]+'</label>').join("")+'</div>')+'</div>';
  $("lado").innerHTML='<div class="box form"><h3>'+(ED.id?"Editar cerca":"Nova cerca")+'</h3>'
    +'<label>Nome da cerca</label><input id="eNome" value="'+esc(ED.nome)+'" placeholder="Ex.: Cerca turno ADM">'
    +'<div style="display:grid;grid-template-columns:2fr 1fr;gap:6px"><div><label>Turno</label><input id="eTurno" value="'+esc(ED.turno||"")+'" placeholder="ADM, Turno, Gemin" list="dlTurnos"><datalist id="dlTurnos"><option>ADM</option><option>Turno</option><option>Gemin</option><option>Manutenção</option></datalist></div><div><label>Cor</label><input id="eCor" type="color" value="'+esc(ED.cor)+'" style="padding:2px;height:36px"></div></div>'
    +'<label>Para que serve esta cerca</label><select id="eFin">'+Object.keys(FIN).filter(k=>k!=="roteiro"||ED.finalidade==="roteiro").map(k=>'<option value="'+k+'"'+(k===ED.finalidade?" selected":"")+'>'+FIN[k]+'</option>').join("")+'</select>'
    +'<div style="display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap"><span class="note" id="nPts"></span><button class="btn sm" id="bDesf">Desfazer ponto</button><button class="btn sm" id="bLimp">Limpar pontos</button></div>'
    +'<label class="chks" style="margin-top:8px"><label><input type="checkbox" id="eAtivo"'+(ED.ativo?" checked":"")+'> Cerca ligada</label></label>'
    +(ED.finalidade==="turno"?'<div class="dica">A chegada é comparada com as viagens de IDA e a saída com as de VOLTA. Turno 12x12 com troca de manhã e de noite: use um horário para cada troca.</div>'
      +'<div id="regras">'+ED.horarios.map(rg).join("")+'</div><button class="btn sm" id="bAddR">+ Outro horário</button>'
      :ED.finalidade==="roteiro"?'<div class="dica">Ponto de controle de uma rota (saída, meio do caminho, descida, chegada). Informe o trecho do nome da linha (ex.: "BELÉM") e a ordem do ponto na rota. A mesma cerca pode ser ponto de várias rotas. O painel <b>Roteirização</b> mostra a hora em que cada viagem passou aqui.</div>'
      +'<div id="regras">'+ED.horarios.map((h,i)=>'<div class="regra" data-i="'+i+'"><div class="g"><label>Rota (nome da linha contém)<input data-f="rota" list="dlLinhas" value="'+esc(h.rota||"")+'" placeholder="Ex.: BELÉM"></label><label>Ordem do ponto<input type="number" min="1" data-f="ordem" value="'+(h.ordem||i+1)+'"></label></div><button class="btn sm" data-rmr="'+i+'">Remover</button></div>').join("")+'</div><button class="btn sm" id="bAddR">+ Outra rota</button>'
      :'<div class="dica">As entradas e saídas nesta cerca já ficam gravadas a partir de agora. O painel dela (horário de chegada, saída ou fim de rota) entra no BI na próxima etapa.</div><div id="regras"></div>')
    +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" id="bCanc">Cancelar</button><button class="btn p" id="bSalv">Salvar cerca</button></div><div id="eMsg" class="msg"></div></div>';
  const ler=()=>{ED.finalidade=$("eFin").value;ED.nome=$("eNome").value;ED.turno=$("eTurno").value;ED.cor=$("eCor").value;ED.ativo=$("eAtivo").checked;
    $("regras").querySelectorAll(".regra").forEach(div=>{const h=ED.horarios[+div.dataset.i];
      div.querySelectorAll("[data-f]").forEach(inp=>{const f=inp.dataset.f;h[f]=inp.type==="number"?(inp.value===""?0:+inp.value):inp.value.trim()});
      h.tipolinhas=[...div.querySelectorAll("[data-tl]:checked")].map(x=>x.dataset.tl);
      if(h.grupo){h.tipolinhas=[];h.linha_contem="";h.linha_exclui=""}
      h.dias=[...div.querySelectorAll("[data-dia]:checked")].map(x=>+x.dataset.dia);
      const md=div.querySelector(".selModo");h._porRota=md&&md.value==="2";
      {const vis=[...div.querySelectorAll("[data-hrota]")];if(vis.length){const nm=vis.map(x=>x.dataset.hrota.toUpperCase());
        h.fora=(h.fora||[]).filter(x=>!nm.includes(x.toUpperCase())).concat(vis.filter(x=>!x.checked).map(x=>x.dataset.hrota))}}
      if(h._porRota){h.rotas=[...div.querySelectorAll("tr[data-rr]")].map(tr=>{const o={linha:tr.dataset.rr};
          tr.querySelectorAll("[data-rf]").forEach(x=>o[x.dataset.rf]=x.type==="number"?(x.value===""?0:+x.value):x.value);
          o.dias=[...tr.querySelectorAll("[data-rdia]:checked")].map(x=>+x.dataset.rdia);return o});
        if(!h.dias.length)h.dias=[1,2,3,4,5,6,7]}
      else h.rotas=[];});};
  $("eCor").oninput=()=>{ED.cor=$("eCor").value;desenharEd()};
  $("bDesf").onclick=()=>{ED.pontos.pop();desenharEd()};
  $("bLimp").onclick=()=>{if(confirm("Apagar todos os pontos desta cerca?")){ED.pontos=[];desenharEd()}};
  $("eFin").onchange=()=>{ler();
    if(ED.finalidade==="roteiro"&&!ED.horarios.some(h=>"rota" in h))ED.horarios=[{rota:"",ordem:1}];
    if(ED.finalidade==="turno"&&!ED.horarios.some(h=>"chegada" in h||"saida" in h))ED.horarios=[regraNova()];
    formEd();desenharEd()};
  if($("bAddR"))$("bAddR").onclick=()=>{ler();ED.horarios.push(ED.finalidade==="roteiro"?{rota:"",ordem:ED.horarios.length+1}:regraNova());formEd();desenharEd()};
  $("regras").querySelectorAll("[data-rmr]").forEach(b=>b.onclick=()=>{ler();ED.horarios.splice(+b.dataset.rmr,1);formEd();desenharEd()});
  $("regras").querySelectorAll(".selGrupo,[data-tl],[data-f=linha_contem],[data-f=linha_exclui],.selModo").forEach(x=>x.onchange=()=>{ler();formEd();desenharEd()});
  $("regras").querySelectorAll("[data-hrota]").forEach(x=>x.onchange=()=>{ler();formEd();desenharEd()});
  $("regras").querySelectorAll("[data-htodas]").forEach(b=>b.onclick=()=>{b.closest(".regra").querySelectorAll("[data-hrota]").forEach(x=>x.checked=b.dataset.htodas==="1");ler();formEd();desenharEd()});
  $("regras").querySelectorAll(".addRota").forEach(sel=>sel.onchange=()=>{if(!sel.value)return;ler();const h=ED.horarios[+sel.closest(".regra").dataset.i];
    const add=sel.value==="*"?rotasDoFiltro(h):[sel.value];
    add.forEach(l=>{if(!h.rotas.some(x=>x.linha===l))h.rotas.push(rotaNova(l,h))});formEd();desenharEd()});
  $("regras").querySelectorAll("[data-rrm]").forEach(b=>b.onclick=()=>{ler();const h=ED.horarios[+b.closest(".regra").dataset.i];h.rotas.splice(+b.dataset.rrm,1);if(!h.rotas.length)h._porRota=true;formEd();desenharEd()});
  $("bCanc").onclick=()=>{ED=null;listaCercas()};
  $("bSalv").onclick=async()=>{ler();
    if(!ED.nome.trim()){msg("eMsg","Dê um nome para a cerca.","err");return}
    if(ED.pontos.length<3){msg("eMsg","Marque pelo menos 3 pontos no mapa.","err");return}
    if(ED.finalidade==="turno")for(const h of ED.horarios){if(!h._porRota&&!h.grupo&&!h.tipolinhas.length&&!h.linha_contem){msg("eMsg","Em cada horário, escolha o grupo de rotas (ou, no personalizado, marque o turno ou o nome da linha).","err");return}
      if(h._porRota){if(!h.rotas.length){msg("eMsg","No horário por rota, escolha pelo menos uma rota na lista.","err");return}
        const sem=h.rotas.find(x=>!x.chegada&&!x.saida);if(sem){msg("eMsg","Informe a chegada e/ou a saída da rota "+sem.linha+".","err");return}
        const sd=h.rotas.find(x=>!x.dias.length);if(sd){msg("eMsg","Marque os dias da rota "+sd.linha+".","err");return}}
      else if(!h.chegada&&!h.saida){msg("eMsg","Em cada horário, informe a chegada e/ou a saída prevista.","err");return}}
    if(ED.finalidade==="turno")ED.horarios.forEach(h=>delete h._porRota);
    if(ED.finalidade==="roteiro"){ED.horarios=ED.horarios.filter(h=>h.rota).map(h=>({rota:h.rota,ordem:+h.ordem||1}));
      if(!ED.horarios.length){msg("eMsg","Informe a rota (trecho do nome da linha) deste ponto.","err");return}}
    msg("eMsg","Salvando…");
    try{await rpc("bi_cerca_salvar",{p_token:TOKEN,p_dados:ED});ED=null;telaCercas()}catch(err){msg("eMsg",err.message,"err")}};
}

  const LS=[...new Set(((OPC&&OPC.linhas)||[]).concat((r.rotas||[]).map(x=>x.linha).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const ORI={manual:["c-ok","manual"],sugerida:["c-blu","sugerida"],aprendida:["c-blu","aprendida"],ignorar:["c-gry","não entra"],"sem de-para":["c-bad","sem de-para"]};

    +'<div class="tb scroll" style="margin-top:6px;max-height:420px"><table class="dt"><thead><tr><th>Rota no Forms</th><th>Registros (60 dias)</th><th>Sem viagem</th><th>Linha da TFleet</th><th>De onde</th><th></th></tr></thead><tbody>'
    +(r.rotas||[]).map((x,i)=>{const o=ORI[x.origem]||["c-gry",x.origem];return'<tr data-fr="'+i+'"><td class="w">'+esc(x.exemplo||x.rota)+'</td><td class="n">'+nf(x.registros)+'</td><td class="n">'+(x.sem?'<b style="color:var(--red)">'+nf(x.sem)+'</b>':"0")+'</td>'
      +'<td><select style="border:1px solid var(--line);border-radius:6px;padding:4px;max-width:260px"><option value="">— escolha —</option><option value="__ign"'+(x.origem==="ignorar"?" selected":"")+'>Não entra no BI (van, extra…)</option>'
      +LS.map(l=>'<option'+(l===x.linha&&x.origem!=="ignorar"?" selected":"")+'>'+esc(l)+'</option>').join("")+'</select></td>'
      +'<td><span class="chip '+o[0]+'">'+o[1]+'</span>'+(x.atualizado_por?' <span class="note">'+esc(x.atualizado_por)+'</span>':'')+'</td><td><button class="btn sm p">Salvar</button></td></tr>'}).join("")
    +'</tbody></table></div><div class="note">"Sem viagem" = registro que não achou viagem da TFleet (rota errada, viagem não aberta na TFleet, ou data/hora digitada errada).</div><div id="formsMsg" class="msg"></div>';
  W.querySelectorAll("tr[data-fr]").forEach(tr=>tr.querySelector(".btn").onclick=async()=>{const x=r.rotas[+tr.dataset.fr],v=tr.querySelector("select").value;
    try{const k=await rpc("bi_forms_rota_salvar",{p_token:TOKEN,p_rota:x.exemplo||x.rota,p_linha:v==="__ign"?null:v,p_ignorar:v==="__ign"});
      msg("formsMsg","Salvo: "+nf(k.casados)+" de "+nf(k.registros)+" registro(s) dessa rota casaram com viagem.","ok");setTimeout(formsSt,1500)}catch(err){msg("formsMsg",err.message,"err")}});
}
async function telaGerenciar(){
  try{INI=await rpc("bi_inicio",{p_token:TOKEN})}catch(err){$("painel").innerHTML='<div class="vazio">Erro: '+esc(err.message)+'</div>';return}
  const P=INI.paineis||[],cf=INI.config||{};
  const SIT={todos:"Todos que entram veem",admin:"Só quem edita vê",excluido:"Excluído (escondido de todos)"};
  $("painel").innerHTML='<div class="box"><h3>Painéis</h3><div class="note" style="margin-bottom:8px">Escolha quem vê cada painel. "Excluído" tira o painel da página para todo mundo; dá para voltar depois aqui mesmo.</div>'
    +'<div class="tb"><table class="dt"><thead><tr><th>Ordem</th><th>Título</th><th>Quem vê</th><th></th><th>Última alteração</th></tr></thead><tbody>'
    +P.map(p=>'<tr data-id="'+p.id+'"><td><input type="number" value="'+p.ordem+'" style="width:60px;border:1px solid var(--line);border-radius:6px;padding:4px"></td>'
      +'<td class="w"><input value="'+esc(p.titulo)+'" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:4px"><div class="note">'+esc(p.descricao||"")+'</div></td>'
      +'<td><select style="border:1px solid var(--line);border-radius:6px;padding:4px">'+Object.keys(SIT).map(s=>'<option value="'+s+'"'+(s===p.situacao?" selected":"")+'>'+SIT[s]+'</option>').join("")+'</select></td>'
      +'<td><button class="btn sm p">Salvar</button></td><td class="note">'+(p.atualizado_por?esc(p.atualizado_por)+'<br>'+dtBR(p.atualizado_em):"")+'</td></tr>').join("")
    +'</tbody></table></div></div>'
    +'<div class="box form" style="max-width:520px"><h3>Ajustes dos cálculos</h3>'
    +'<label>Lugares por ônibus (para a ocupação %)</label><input type="number" id="aLug" min="1" value="'+(cf.lugares||45)+'">'
    +'<label>Valor por pessoa (R$ por embarque, painel de custo)</label><input type="number" id="aVal" min="0" step="0.01" value="'+(cf.valor_pessoa??40.9)+'">'
    +'<label>Buraco de GPS que deixa o horário incerto (min)</label><input type="number" id="aGap" min="1" value="'+(cf.gap_min||5)+'">'
    +'<label>Margem das cercas (metros): parar até essa distância da borda, do lado de fora, conta como dentro</label><input type="number" id="aMarg" min="0" max="300" value="'+(cf.margem_m??30)+'">'
    +'<div style="margin-top:10px"><button class="btn p" id="aSalv">Salvar ajustes</button></div><div id="aMsg" class="msg"></div></div>'
    +'<div class="box form" style="max-width:720px"><h3>Viagens por dia</h3><div class="note">Turnos que aparecem no painel e o ideal de viagens por dia de cada um.</div>'
    +'<div id="aVt">'+[...new Set(((OPC&&OPC.tipolinhas)||[]).concat(cf.viagens_turnos||[]))].map(t=>'<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--ink);flex:1"><input type="checkbox" style="width:auto" data-vt="'+esc(t)+'"'+((cf.viagens_turnos||[]).includes(t)?" checked":"")+'>'+esc(t)+'</label><input type="number" min="0" placeholder="ideal/dia" style="width:110px" data-vi="'+esc(t)+'" value="'+esc((cf.viagens_ideal||{})[t]??"")+'"></div>').join("")+'</div></div>'
    +'<div class="box form" style="max-width:900px"><h3>Rotas de cada turno (painel Horários)</h3><div class="note">Cada grupo diz quais rotas da TFleet são de um turno. Na cerca, cada horário escolhe um grupo. Ex.: os CTs (terceiras) ficam num grupo próprio para terem horário diferente do ADM. Embaixo de cada grupo aparecem as rotas que entram: desmarque as que não são daquele turno.</div>'
    +'<label>Rotas que NUNCA entram no painel Horários (nome contém, separe por vírgula)</label><input id="gExcl" value="'+esc(cf.horarios_excluir??"APRENDIZ, EXTRA")+'">'
    +'<div id="gLista"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" id="gAdd">+ Novo grupo</button><button class="btn p" id="gSalv">Salvar grupos</button></div><div id="gMsg" class="msg"></div></div>'
    +'<div class="box form" style="max-width:720px"><h3>Áreas válidas dos pontos de embarque</h3><div class="note">Pontos fora destas áreas são GPS errado e não aparecem no mapa. Uma área por linha: nome; lat mín; lat máx; lon mín; lon máx</div>'
    +'<textarea id="aAreas" rows="4" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:13px monospace">'+esc((cf.areas||[]).map(a=>[a.nome,a.lat_min,a.lat_max,a.lon_min,a.lon_max].join("; ")).join("\n"))+'</textarea>'
    +'<div style="margin-top:8px"><button class="btn p" id="aSalv2">Salvar viagens e áreas</button></div><div id="aMsg2" class="msg"></div></div>'
    +'<div class="box"><h3>Forms dos motoristas (hora informada)</h3><div class="note" style="margin-bottom:6px">Planilha "CONTROLE DE OCUPAÇÃO E PONTUALIDADE" (aba REGISTRO_VIAGENS), mandada pelo robô a cada 15 min. Cada registro é casado com a viagem da TFleet pela <b>rota</b> abaixo, a <b>data/hora</b> (até 4 h) e o <b>sentido</b> (Entrada = IDA, Saída = VOLTA). Rota sem de-para casa pelo nome do motorista e é aprendida depois de 3 vezes.</div><div id="formsSt" class="note">Carregando…</div></div>'
    +'<div class="box"><h3>Coleta da TFleet <span class="r"><button class="btn sm p" id="bColeta">Coletar agora</button></span></h3><div id="coletaSt" class="note">Carregando…</div></div>'
    +'<div class="box"><h3>Acesso</h3><div class="note">Entram no BI: administradores da Central e quem tem o painel <b>bi</b> ou <b>lotacao</b> marcado na Gestão de acessos. Editam (este menu e as cercas): administradores e quem tem <b>bi: editar</b>. A senha de gestores também edita.</div></div>';
  $("painel").querySelectorAll("tr[data-id]").forEach(tr=>tr.querySelector(".btn").onclick=async()=>{
    const [o,t]=tr.querySelectorAll("input"),s=tr.querySelector("select");
    try{await rpc("bi_painel_salvar",{p_token:TOKEN,p_id:tr.dataset.id,p_titulo:t.value,p_ordem:+o.value,p_situacao:s.value});
      INI=await rpc("bi_inicio",{p_token:TOKEN});montarAbas()}catch(err){alert(err.message)}});
  $("aSalv2").onclick=async()=>{
    const vt=[...document.querySelectorAll("[data-vt]:checked")].map(x=>x.dataset.vt),vi={};
    document.querySelectorAll("[data-vi]").forEach(x=>{if(x.value!=="")vi[x.dataset.vi]=+x.value});
    const areas=[];for(const ln of $("aAreas").value.split("\n")){if(!ln.trim())continue;const p=ln.split(";").map(x=>x.trim());
      if(p.length<5||p.slice(1).some(x=>isNaN(+x.replace(",",".")))){msg("aMsg2","Linha de área inválida: "+ln,"err");return}
      areas.push({nome:p[0],lat_min:+p[1].replace(",","."),lat_max:+p[2].replace(",","."),lon_min:+p[3].replace(",","."),lon_max:+p[4].replace(",",".")})}
    if(!vt.length){msg("aMsg2","Marque pelo menos um turno.","err");return}
    try{await rpc("bi_config_salvar",{p_token:TOKEN,p_dados:{viagens_turnos:vt,viagens_ideal:vi,areas}});msg("aMsg2","Salvo.","ok")}catch(err){msg("aMsg2",err.message,"err")}};
  // ---- grupos de rotas
  let GR=JSON.parse(JSON.stringify(cf.grupos||[]));
  const lerG=()=>{$("gLista").querySelectorAll(".regra").forEach(div=>{const g=GR[+div.dataset.i];
    g.nome=div.querySelector("[data-g=nome]").value.trim();g.contem=div.querySelector("[data-g=contem]").value.trim();g.excluir=div.querySelector("[data-g=excluir]").value.trim();
    g.tipolinhas=[...div.querySelectorAll("[data-gtl]:checked")].map(x=>x.dataset.gtl);
    // rotas desmarcadas ficam fora; as que já estavam fora e não aparecem na lista agora (sem viagem em 60 dias) continuam fora
    const vis=[...div.querySelectorAll("[data-grota]")];const nomes=vis.map(x=>x.dataset.grota.toUpperCase());
    g.fora=(g.fora||[]).filter(x=>!nomes.includes(x.toUpperCase())).concat(vis.filter(x=>!x.checked).map(x=>x.dataset.grota))})};
  const pintaG=()=>{const tl=(OPC&&OPC.tipolinhas)||[];
    $("gLista").innerHTML=GR.map((g,i)=>'<div class="regra" data-i="'+i+'"><div style="display:flex;gap:6px;align-items:center"><input data-g="nome" value="'+esc(g.nome)+'" placeholder="Nome do grupo" style="font-weight:600;flex:1"><button class="btn sm red" data-grm="'+i+'">Tirar</button></div>'
      +'<label>Turno da linha na TFleet (deixe sem marcar para não filtrar por turno)</label><div class="chks">'+tl.map(t=>'<label><input type="checkbox" data-gtl="'+esc(t)+'"'+((g.tipolinhas||[]).includes(t)?" checked":"")+'>'+esc(t)+'</label>').join("")+'</div>'
      +'<div class="g" style="grid-template-columns:1fr 1fr"><label>Nome da linha contém<input data-g="contem" value="'+esc(g.contem||"")+'" placeholder="ex.: ^CT  (^ = começa com)"></label><label>Nome da linha NÃO contém<input data-g="excluir" value="'+esc(g.excluir||"")+'" placeholder="ex.: ^CT, MINA"></label></div>'
      +previaLinhas(g,$("gExcl").value,1)+'</div>').join("")||'<div class="note">Nenhum grupo.</div>';
    $("gLista").querySelectorAll("input").forEach(x=>x.onchange=()=>{lerG();pintaG()});
    $("gLista").querySelectorAll("[data-gtodas]").forEach(b=>b.onclick=()=>{b.closest(".regra").querySelectorAll("[data-grota]").forEach(x=>x.checked=b.dataset.gtodas==="1");lerG();pintaG()});
    $("gLista").querySelectorAll("[data-grm]").forEach(b=>b.onclick=()=>{lerG();GR.splice(+b.dataset.grm,1);pintaG()});};
  pintaG();$("gExcl").onchange=()=>{lerG();pintaG()};
  $("gAdd").onclick=()=>{lerG();GR.push({nome:"",tipolinhas:[],contem:"",excluir:""});pintaG()};
  $("gSalv").onclick=async()=>{lerG();
    if(GR.some(g=>!g.nome)){msg("gMsg","Dê um nome para cada grupo.","err");return}
    if(new Set(GR.map(g=>g.nome.toUpperCase())).size<GR.length){msg("gMsg","Há dois grupos com o mesmo nome.","err");return}
    if(GR.some(g=>!(g.tipolinhas||[]).length&&!g.contem)){msg("gMsg","Em cada grupo, marque um turno ou preencha \"contém\".","err");return}
    try{await rpc("bi_config_salvar",{p_token:TOKEN,p_dados:{grupos:GR,horarios_excluir:$("gExcl").value}});INI=await rpc("bi_inicio",{p_token:TOKEN});msg("gMsg","Salvo. Nas cercas, escolha o grupo em cada horário.","ok")}catch(err){msg("gMsg",err.message,"err")}};
  const coleta=async()=>{try{const c=await rpc("bi_coleta_status",{p_token:TOKEN});
      $("coletaSt").innerHTML=(c.configurada?'':'<div class="faixa warn">Falta colocar o acesso e o token da TFleet (passo 3 do bi-coleta.sql).</div>')
        +'Última viagem gravada: <b>'+(c.ultima_viagem?dtBR(c.ultima_viagem):"—")+'</b> · último embarque: <b>'+(c.ultimo_embarque?dtBR(c.ultimo_embarque):"—")+'</b>'
        +'<table class="dt" style="margin-top:6px"><thead><tr><th>Quando</th><th>API</th><th>Resultado</th><th>Quem</th></tr></thead><tbody>'
        +(c.log||[]).map(l=>'<tr><td>'+dtBR(l.disparado_em)+'</td><td>'+esc(l.endpoint)+'</td><td>'+(!l.processado_em?'<span class="chip c-blu">aguardando</span>':l.erro?'<span class="chip c-bad">erro</span> '+esc(l.erro):'<span class="chip c-ok">ok</span> '+nf(l.linhas)+' linhas')+'</td><td>'+esc(l.por||"")+'</td></tr>').join("")+'</tbody></table>';
    }catch(err){$("coletaSt").innerHTML=/bi_coleta_status/.test(err.message)?'A coleta pelo Supabase ainda não foi instalada (rodar <b>bi-coleta.sql</b>).':'Erro: '+esc(err.message)}};
  coleta();formsSt();
  $("bColeta").onclick=async()=>{try{const r=await rpc("bi_coleta_agora",{p_token:TOKEN});alert(r==="ok"?"Coleta disparada. O resultado aparece aqui em 1 a 2 minutos.":r);setTimeout(coleta,70000);coleta()}catch(err){alert(err.message)}};
  $("aSalv").onclick=async()=>{try{await rpc("bi_config_salvar",{p_token:TOKEN,p_dados:{lugares:+$("aLug").value,valor_pessoa:+$("aVal").value,gap_min:+$("aGap").value,margem_m:+$("aMarg").value}});
      if(INI.config&&+$("aMarg").value!==+(INI.config.margem_m??30))msg("aMsg","Salvo. A margem mudou: os dias já calculados são refeitos quando você abrir o Horários (rode também: delete from bi_cerca_dias;).","ok");else msg("aMsg","Salvo.","ok");
      INI=await rpc("bi_inicio",{p_token:TOKEN})}catch(err){msg("aMsg",err.message,"err")}};
}

iniciar();
</script>
<script src="../central-voltar.js"></script>
