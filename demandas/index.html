<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demandas · Gestão Integrada</title>
<meta name="theme-color" content="#16324f">
<style>
/* mesmo visual da Central (tema claro fixo) */
:root{--bg:#f4f6fb;--card:#fff;--card2:#f8fafc;--ink:#0f172a;--mut:#5b6678;--line:#e4e8f0;--brand:#2563eb;--brand-ink:#1d4ed8;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0891b2;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --red:#dc2626;--redbg:#fdecec;--ora:#c2410c;--orabg:#fff1e6;--yel:#a16207;--yelbg:#fef6d8;--grn:#15803d;--grnbg:#e7f6ec;--gry:#64748b;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header.top{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:16px 16px 6px}
header.top .tt{margin-right:auto}
header.top h1{font-size:20px;margin:0;letter-spacing:.2px}
header.top .sub{color:var(--mut);font-size:13px;margin:0}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 13px system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c9d1de}
.btn.p,.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.d{color:var(--bad)}
.btn:disabled{opacity:.6;cursor:default}
.bell{position:relative}
.bell b{position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.who{font-size:13px;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px;align-items:center}
.bar input,.bar select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;min-width:0}
.bar input[type=search]{flex:1 1 200px;max-width:340px}
.alerta{margin:0 16px 6px;background:var(--redbg);color:var(--red);border:1px solid #f5c2c2;border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer}
.board{display:flex;gap:12px;padding:6px 16px 24px;overflow-x:auto;align-items:flex-start}
.col{flex:1 0 205px;max-width:340px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:calc(100vh - 160px)}
.col h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin:0;padding:10px 12px;display:flex;align-items:center;gap:8px;color:var(--c)}
.col h2 span{margin-left:auto;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border-radius:999px;padding:0 8px;font-size:12px}
.list{padding:0 8px 10px;overflow-y:auto;flex:1;min-height:40px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--brand);outline-offset:-2px}
.vazio{color:var(--mut);font-size:13px;text-align:center;padding:8px 0}
.k{background:color-mix(in srgb,var(--c) 6%,#fff);border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));border-left:4px solid var(--c);border-radius:10px;padding:9px 10px;cursor:pointer}
.k:hover{box-shadow:var(--shadow)}
.k.vencido{border-left-color:var(--red)}.k.sem_resposta{border-left-color:var(--ora)}
.k .f{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.k .a{font-weight:600;margin:2px 0 6px;line-height:1.3}
.k .m{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mut);align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.vencido{background:var(--redbg);color:var(--red)}.chip.sem_resposta{background:var(--orabg);color:var(--ora)}
.chip.vence_hoje,.chip.vence_amanha{background:var(--yelbg);color:var(--yel)}
.chip.no_prazo,.chip.entregue{background:var(--grnbg);color:var(--grn)}
.chip.sem_prazo,.chip.cancelado{background:#eef1f5;color:var(--gry)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.dlg{background:#fff;border-radius:14px;width:100%;max-width:760px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.dlg.small{max-width:440px}
.dh{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:17px;flex:1}
.x{border:1px solid var(--line);background:var(--card2);border-radius:8px;font:600 14px system-ui,sans-serif;color:var(--ink);padding:8px 14px;white-space:nowrap;flex:none}
.x:hover{border-color:#c9d1de;background:#eef1f5}
.db{padding:14px 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid .full{grid-column:1/-1}
label.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);font-weight:600}
label.fl input,label.fl select,label.fl textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-weight:400;font-size:14px;color:var(--ink);background:#fff;width:100%}
label.fl input:disabled,label.fl textarea:disabled{background:var(--card2);color:#334155}
textarea{resize:vertical}
.st{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.st button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px}
.st button.on{background:var(--c);border-color:var(--c);color:#fff}
.st button:disabled{opacity:.4;cursor:not-allowed}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px;align-items:center}
.msg{font-size:13px;margin-top:8px}.msg.err{color:var(--red)}.msg.ok{color:var(--grn)}
.tl{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.tl h4,.sec4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ev .d{color:var(--mut);white-space:nowrap;min-width:92px}
.ev .t{flex:1;min-width:0}
.ev.comentario .t{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;white-space:pre-wrap}
.ev.email .t{background:#eef4ff;border:1px solid #d6e2fb;border-radius:8px;padding:6px 9px}
.ev.aviso .t{color:var(--ora)}
.cbox{display:flex;gap:8px;margin-bottom:8px}.cbox textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.note{font-size:12px;color:var(--mut)}
.login{max-width:380px;margin:12vh auto 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.login h2{margin:0 0 4px;font-size:19px}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;font-size:16px}
.login .btn{width:100%;justify-content:center;padding:10px}
.ntf .it{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 2px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
code.key{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;word-break:break-all;display:inline-block}
/* destinatários */
.dest{border:1px solid var(--line);border-radius:8px;padding:5px;display:flex;flex-wrap:wrap;gap:5px;background:#fff}
.st{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}.st.ok{background:#e3f4e8;color:#1b6b34}.st.err{background:#fde7e7;color:#b3261e}
.dest .tag{background:#eef4ff;color:var(--brand-ink);border-radius:999px;padding:2px 4px 2px 9px;font-size:13px;display:inline-flex;align-items:center;gap:2px}
.dest .tag button{border:0;background:none;color:inherit;font-size:15px;line-height:1;padding:0 4px}
.dest input{border:0!important;outline:0;flex:1 1 160px;padding:3px 4px!important;min-width:120px}
.sug{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.sug button{border:1px dashed #c9d1de;background:#fff;border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mut)}
.sug button:hover{border-color:var(--brand);color:var(--brand)}
.anx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.anx span{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px}
.anx a{cursor:pointer;color:var(--brand)}
.pedido{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;font-size:14px;max-height:220px;overflow:auto}
.anx label{cursor:pointer}
.pub{max-width:820px;margin:0 auto;padding:16px}
.pubcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0}
.kv div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
@media (max-width:640px){
  header.top{padding:12px 12px 4px}.bar{padding:6px 12px}.board{padding:6px 12px 20px}
  .col{flex-basis:84vw}.grid{grid-template-columns:1fr}.who{display:none}
  .ov{padding:0}.dlg{border-radius:0;min-height:100vh}
}
</style>
</head>
<body>

<div id="vLogin" class="login hidden">
  <h2>Solicitações a fornecedores</h2>
  <div class="note">Da casa: só a sua senha pessoal (a mesma da Central). Fornecedor: o seu e-mail + o número de acesso que recebeu.</div>
  <form id="fLogin"><input id="lEmail" type="email" autocomplete="username" placeholder="E-mail (só fornecedor)">
  <input id="lSenha" type="password" inputmode="text" autocomplete="current-password" placeholder="Senha ou número de acesso" required>
  <button class="btn p">Entrar</button></form>
  <div id="lMsg" class="msg"></div>
</div>

<div id="vApp" class="hidden">
  <header class="top">
    <div class="tt"><h1>Solicitações a fornecedores</h1><p class="sub">Gestão Integrada · andamento de cada pedido: quem assumiu, quando começou e o prazo</p></div>
    <span class="who" id="who"></span>
    <button class="btn bell" id="bBell" title="Avisos">🔔 Avisos<b id="bellN" class="hidden">0</b></button>
    <button class="btn hidden" id="bContatos">Contatos e acessos</button>
    <button class="btn" id="bSair">Sair</button>
    <button class="btn p hidden" id="bNovo">+ Nova solicitação</button>
  </header>
  <div class="bar">
    <input id="fBusca" type="search" placeholder="Buscar assunto, responsável…">
    <select id="fForn"><option value="">Todos os fornecedores</option></select>
    <label class="note"><input type="checkbox" id="fFechados"> mostrar Entregue/Cancelado antigos</label>
    <span class="note" id="atual"></span>
  </div>
  <div id="alerta" class="alerta hidden"></div>
  <div id="alertaP" class="alerta hidden" style="background:#eef4ff;color:#1d4ed8;border-color:#d6e2fb"></div>
  <div class="board" id="board"></div>
</div>

<div id="vPub" class="pub hidden"></div>

<div id="ov" class="ov hidden"><div class="dlg" id="dlg"></div></div>

<script>
const SB_URL="https://orhuxmsrdnugpogvtnbg.supabase.co";
const SB_KEY="sb_publishable_Hu4Ns0jDTesWzDmVseAl_Q_ubCJa5wL";
const COLS=[["Enviado","#475569"],["Assumido","#2563eb"],["Em andamento","#7c3aed"],["Entregue","#16a34a"],["Sem resposta","#ea580c"],["Cancelado","#94a3b8"]];
const COR=Object.fromEntries(COLS);
const FORN_STATUS=["Assumido","Em andamento","Entregue"];   // o que o fornecedor pode escolher
const MAX_ANEXOS=15*1024*1024;
const K_SESS="tf_solicitacoes", K_CENTRAL="tf_sessao";
let TOKEN=null, QUEM=null, CARDS=[], CONTATOS=[], PEDIDOS=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const dBR=s=>s?String(s).slice(0,10).split("-").reverse().join("/"):"—";
const dtBR=s=>{if(!s)return"";const d=new Date(s);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};
const hoje=()=>new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
const kb=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
const okMail=e=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
const QS=new URLSearchParams(location.search);

async function rpc(fn,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&(j.message||j.hint))||t||("Erro "+r.status);if(/sessao/.test(m)){sairLocal();throw new Error("Sessão expirada, entre de novo.")}throw new Error(m)}
  return j;
}

/* ---------------- entrar ---------------- */
async function iniciar(){
  const cand=[ls.get(K_SESS), ls.get(K_CENTRAL)].filter(s=>s&&s.token);
  for(const s of cand){try{const q=await rpc("sol_sessao",{p_token:s.token});if(q&&!q.erro){entrar(s.token,q);return}}catch(e){}}
  const pk=QS.get("d")||QS.get("v");if(pk){publico(pk);return}
  mostrarLogin();
}
function mostrarLogin(){$("vPub").classList.add("hidden");$("vLogin").classList.remove("hidden");$("lEmail").focus()}
$("fLogin").onsubmit=async e=>{e.preventDefault();msg("lMsg","Entrando…");
  try{const r=await rpc("sol_entrar",{p_senha:$("lSenha").value,p_email:$("lEmail").value.trim()||null});
    if(r.erro){msg("lMsg",r.erro,"err");return}
    ls.set(K_SESS,{token:r.token,nome:r.nome});entrar(r.token,r);
  }catch(err){msg("lMsg","Erro: "+err.message,"err")}};
function entrar(tk,q){TOKEN=tk;QUEM=q;["vLogin","vPub"].forEach(i=>$(i).classList.add("hidden"));$("vApp").classList.remove("hidden");
  $("who").textContent=q.nome+(q.tipo==="fornecedor"?" · "+q.fornecedor:"");
  const interno=q.tipo==="interno";$("bNovo").classList.toggle("hidden",!(interno&&q.edita));
  $("bContatos").classList.toggle("hidden",!(interno&&q.edita));
  $("fForn").classList.toggle("hidden",!interno);carregar(true);setInterval(()=>carregar(false),120000);
  if(interno)rpc("sol_contatos_lista",{p_token:TOKEN}).then(c=>CONTATOS=c||[]).catch(()=>{});}
function sairLocal(){ls.del(K_SESS);TOKEN=null;}
$("bSair").onclick=async()=>{try{await rpc("sol_sair",{p_token:TOKEN})}catch(e){}sairLocal();location.href=location.pathname};

/* ---------------- dados ---------------- */
async function carregar(primeira){
  try{CARDS=await rpc("sol_listar",{p_token:TOKEN})||[];}catch(e){$("atual").textContent="Erro ao carregar: "+e.message;return}
  $("atual").textContent="Atualizado "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const fs=[...new Set(CARDS.map(c=>c.fornecedor))].sort(),sel=$("fForn"),v=sel.value;
  sel.innerHTML='<option value="">Todos os fornecedores</option>'+fs.map(f=>`<option ${f===v?"selected":""}>${esc(f)}</option>`).join("");
  if(QUEM.admin){try{PEDIDOS=await rpc("sol_pedidos_lista",{p_token:TOKEN})||[]}catch(e){}}
  desenhar();avisos(primeira);
  if(primeira&&QS.get("acessos")&&QUEM.admin){acessos();return}
  if(primeira){const c=QS.get("c"),v=QS.get("d")||QS.get("v");
    if(c)abrir(+c);else if(v){const k=CARDS.find(x=>x.slug===v||x.chave_publica===v);if(k)abrir(k.id)}}
}
function sitTxt(c){switch(c.situacao){
  case"vencido":return"Vencido há "+(-c.dias_para_prazo)+" dia"+(c.dias_para_prazo===-1?"":"s");
  case"vence_hoje":return"Vence hoje";case"vence_amanha":return"Vence amanhã";
  case"sem_resposta":return c.dias_sem_contato+" dias sem resposta";
  case"no_prazo":return"Prazo "+dBR(c.prazo);case"entregue":return"Entregue "+dBR(c.entregue_em);
  case"cancelado":return"Cancelado";default:return"Sem prazo"}}
function filtrados(){const b=$("fBusca").value.trim().toLowerCase(),f=$("fForn").value,velhos=$("fFechados").checked;
  return CARDS.filter(c=>(!f||c.fornecedor===f)&&(!b||[c.assunto,c.responsavel,c.fornecedor,c.descricao].join(" ").toLowerCase().includes(b))
    &&(velhos||!["Entregue","Cancelado"].includes(c.status)||((Date.now()-new Date(c.atualizado_em))/864e5)<30));}
function desenhar(){
  const lst=filtrados(),bd=$("board");bd.innerHTML="";
  const podeMover=QUEM.edita;
  COLS.forEach(([st,cor])=>{
    const cs=lst.filter(c=>c.status===st),col=document.createElement("section");col.className="col";col.dataset.st=st;col.style.setProperty("--c",cor);
    col.innerHTML=`<h2>${st}<span>${cs.length}</span></h2><div class="list"></div>`;
    const L=col.querySelector(".list");
    if(!cs.length)L.innerHTML='<div class="vazio">—</div>';
    cs.forEach(c=>{const k=document.createElement("article");k.className="k "+c.situacao;k.dataset.id=c.id;
      k.innerHTML=`<div class="f">${esc(c.fornecedor)}</div><div class="a">${esc(c.assunto)}</div>
      <div class="m"><span class="chip ${c.situacao}">${esc(sitTxt(c))}</span>${c.responsavel?`<span>👤 ${esc(c.responsavel)}</span>`:""}
      ${c.comentarios?`<span>💬 ${c.comentarios}</span>`:""}<span title="Enviado em">✉ ${dBR(c.enviado_em)}</span></div>`;
      k.onclick=()=>abrir(c.id);
      if(podeMover){k.draggable=true;k.ondragstart=e=>{e.dataTransfer.setData("text/plain",c.id)}}
      L.appendChild(k)});
    if(podeMover){col.ondragover=e=>{e.preventDefault();col.classList.add("over")};col.ondragleave=()=>col.classList.remove("over");
      col.ondrop=async e=>{e.preventDefault();col.classList.remove("over");const id=+e.dataTransfer.getData("text/plain");const c=CARDS.find(x=>x.id===id);
        if(!c||c.status===st)return;if(QUEM.tipo==="fornecedor"&&!FORN_STATUS.includes(st)){alert("Esse status é só para quem pediu.");return}
        try{await rpc("sol_salvar",{p_token:TOKEN,p_id:id,p_dados:{status:st}});carregar(false)}catch(err){alert(err.message)}}}
    bd.appendChild(col)});
}
["fBusca","fForn","fFechados"].forEach(i=>$(i).addEventListener("input",desenhar));

/* ---------------- avisos na página ---------------- */
function atrasados(){return CARDS.filter(c=>["vencido","vence_hoje","vence_amanha","sem_resposta"].includes(c.situacao))}
function avisos(primeira){
  const a=atrasados(),v=a.filter(c=>c.situacao==="vencido").length,n=$("bellN");
  n.textContent=a.length+PEDIDOS.length;n.classList.toggle("hidden",!(a.length+PEDIDOS.length));
  const ap=$("alertaP");if(PEDIDOS.length){ap.innerHTML=`🔑 ${PEDIDOS.length} pedido${PEDIDOS.length>1?"s":""} de acesso esperando sua aprovação: ${PEDIDOS.map(p=>esc(p.nome)+" (por "+esc(p.pedido_por)+")").join(", ")}. Clique para ver.`;ap.classList.remove("hidden")}else ap.classList.add("hidden");
  const al=$("alerta");
  if(v){al.innerHTML=`⚠️ ${v} ${v>1?"solicitações":"solicitação"} com prazo vencido. Clique para ver.`;al.classList.remove("hidden")}else al.classList.add("hidden");
  if(primeira&&a.length&&"Notification"in window&&Notification.permission==="granted"){
    const kd="tf_sol_notif_"+hoje();if(!ls.get(kd)){ls.set(kd,1);
      try{new Notification("Solicitações: "+a.length+" precisa"+(a.length>1?"m":"")+" de atenção",{body:a.slice(0,4).map(c=>c.fornecedor+": "+sitTxt(c)).join("\n")})}catch(e){}}}
}
$("alertaP").onclick=()=>acessos();
$("alerta").onclick=$("bBell").onclick=()=>{
  const a=atrasados();
  dlg(`<div class="dh"><h3>Avisos</h3><button class="x" onclick="fechar()">✕ Fechar</button></div><div class="db ntf">
  ${PEDIDOS.length?`<button class="it" onclick="acessos()">🔑 <b>${PEDIDOS.length} pedido(s) de acesso</b> esperando sua aprovação</button>`:""}
  ${a.length?a.map(c=>`<button class="it" onclick="abrir(${c.id})"><span class="chip ${c.situacao}">${esc(sitTxt(c))}</span> <b>${esc(c.fornecedor)}</b> · ${esc(c.assunto)}</button>`).join(""):'<div class="note">Nada atrasado. 👍</div>'}
  ${"Notification"in window&&Notification.permission!=="granted"?`<div class="acts" style="justify-content:flex-start"><button class="btn" onclick="Notification.requestPermission().then(()=>fechar())">Ativar notificação neste aparelho</button></div>`:""}
  <p class="note">Quando um prazo vence, também sai um e-mail para os e-mails do cartão (1 vez por dia).</p></div>`,true)};

/* ---------------- janela ---------------- */
function dlg(html,small){$("dlg").className="dlg"+(small?" small":"");$("dlg").innerHTML=html;$("ov").classList.remove("hidden");$("ov").scrollTop=0}
/* a janela só fecha pelo botão "Fechar" (clicar fora ou arrastar a seleção para fora não fecha) */
let CUR=null;
async function guardar(){ // salva o que foi mexido no cartão aberto, sem enviar nada
  if(!CUR||!QUEM||!QUEM.edita||!$("stb")||!$("cSalvar"))return true;
  const d=coletar(CUR);if(!Object.keys(d).length)return true;
  try{msg("cMsg","Guardando…");await rpc("sol_salvar",{p_token:TOKEN,p_id:CUR.id,p_dados:d});Object.assign(CUR,d);msg("cMsg","Guardado.","ok");return true}
  catch(e){msg("cMsg","Não consegui guardar: "+e.message,"err");return false}}
async function fechar(){const tinha=CUR&&$("cSalvar");if(!(await guardar()))return;
  $("ov").classList.add("hidden");CUR=null;if(location.search)history.replaceState(null,"",location.pathname);if(tinha)carregar(false)}
function msg(id,t,cl){const m=$(id);if(m){m.textContent=t;m.className="msg "+(cl||"")}}

const CAMPOS=[ // [campo, rótulo, tipo, fornecedor pode editar, classe]
  ["fornecedor","Fornecedor","text",0],["responsavel","Responsável no fornecedor","text",1],
  ["assunto","Assunto (título do cartão)","text",0,"full"],
  ["enviado_em","Enviado em","date",0],["inicio_em","Começou em","date",1],
  ["prazo","Prazo de entrega","date",1],["entregue_em","Entregue em","date",1],
  ["ultimo_contato","Último contato","date",0]];

function form(c){
  const forn=QUEM.tipo==="fornecedor",ed=QUEM.edita;
  return `<div class="grid">${CAMPOS.map(([k,l,t,fp,cl])=>{
    const dis=!ed||(forn&&!fp)?"disabled":"";let v=c[k]==null?"":c[k];if(t==="date")v=String(v).slice(0,10);
    const inp=t==="area"?`<textarea id="c_${k}" rows="3" ${dis}>${esc(v)}</textarea>`:`<input id="c_${k}" type="${t}" value="${esc(v)}" ${dis} ${k==="fornecedor"?'list="dlForn"':""}>`;
    return `<label class="fl ${cl||""}">${l}${k==="prazo"&&c.prazo_original&&c.prazo_original!==c.prazo?` <span class="note">(1º prazo: ${dBR(c.prazo_original)})</span>`:""}${inp}</label>`}).join("")}
    ${!forn&&ed?`<label class="fl full">Pedido (texto do e-mail)<textarea id="c_descricao" rows="6" placeholder="Prezados,&#10;&#10;…">${esc(c.descricao||"")}</textarea></label>`
      :c.descricao?`<div class="fl full"><label class="fl" style="margin:0">Pedido (texto enviado)</label><div class="pedido">${esc(c.descricao)}</div></div>`:""}
    ${c.status!=="Enviado"||c.observacoes?`<label class="fl full">Observações / próximos passos<textarea id="c_observacoes" rows="3" ${ed?"":"disabled"} placeholder="ex.: o que falta, combinado na reunião, próximo passo">${esc(c.observacoes||"")}</textarea></label>`:""}
    ${!forn?`<div class="fl full"><label class="fl" style="margin:0">E-mails que recebem os avisos de prazo</label>${destHTML("dAviso",c.emails||[])}</div>`:""}</div>
    <datalist id="dlForn">${[...new Set(CARDS.map(x=>x.fornecedor))].map(f=>`<option value="${esc(f)}">`).join("")}</datalist>`;
}
function stBtns(c){const forn=QUEM.tipo==="fornecedor";
  return `<div class="st" id="stb">${COLS.map(([s,cor])=>`<button data-s="${s}" style="--c:${cor}" class="${c.status===s?"on":""}" ${!QUEM.edita||(forn&&!FORN_STATUS.includes(s))?"disabled":""}>${s}</button>`).join("")}</div>`}
function ligaSt(){document.querySelectorAll("#stb button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#stb button").forEach(x=>x.classList.remove("on"));b.classList.add("on")})}
function coletar(c){const d={},forn=QUEM.tipo==="fornecedor";
  CAMPOS.forEach(([k,,t,fp])=>{if(forn&&!fp)return;const el=$("c_"+k);if(!el)return;let v=el.value.trim();
    if(v==="")v=null;const ant=c[k]==null?null:(t==="date"?String(c[k]).slice(0,10):c[k]);if(v!==ant)d[k]=v});
  if($("c_descricao")){const v=$("c_descricao").value.trim()?$("c_descricao").value:null;if(v!==(c.descricao||null))d.descricao=v}
  if($("c_observacoes")){const v=$("c_observacoes").value.trim()||null;if(v!==(c.observacoes||null))d.observacoes=v}
  if(!forn&&$("dAviso")){const novo=destLer("dAviso");if(novo.join(",")!==(c.emails||[]).join(","))d.emails=novo}
  const s=document.querySelector("#stb .on");if(s&&s.dataset.s!==c.status)d.status=s.dataset.s;return d}

/* ---------- campo de destinatários com contatos salvos ---------- */
function destHTML(id,lista){
  return `<div class="dest" id="${id}" onclick="if(event.target===this)this.querySelector('input').focus()">${lista.map(tagHTML).join("")}
  <input placeholder="digite o e-mail ou escolha abaixo" list="dl_${id}" onkeydown="destKey(event,'${id}')" onchange="destAdd('${id}',this.value);this.value=''" onblur="destAdd('${id}',this.value);this.value=''"></div>
  <datalist id="dl_${id}">${CONTATOS.map(c=>`<option value="${esc(c.email)}">${esc(c.nome||"")}${c.fornecedor?" · "+esc(c.fornecedor):""}</option>`).join("")}</datalist>
  <div class="sug" id="sg_${id}">${sugHTML(id,lista)}</div>`;
}
function tagHTML(e){const c=CONTATOS.find(x=>x.email===e);return `<span class="tag" data-e="${esc(e)}" title="${esc(e)}">${esc(c&&c.nome?c.nome:e)}<button type="button" onclick="this.parentNode.remove();destSug(this)">×</button></span>`}
function sugHTML(id,lista){const forn=($("c_fornecedor")||{}).value||"";
  const s=CONTATOS.filter(c=>!lista.includes(c.email)).sort((a,b)=>(b.fornecedor===forn)-(a.fornecedor===forn)||b.usos-a.usos).slice(0,10);
  return s.map(c=>`<button type="button" onclick="destAdd('${id}','${esc(c.email)}')">+ ${esc(c.nome||c.email)}</button>`).join("")}
function destLer(id){return [...$(id).querySelectorAll(".tag")].map(t=>t.dataset.e)}
function destAdd(id,v){const box=$(id);if(!box)return;(v||"").split(/[,;\s]+/).map(x=>x.trim().toLowerCase()).filter(Boolean).forEach(e=>{
  if(!okMail(e)){alert("E-mail inválido: "+e);return}if(destLer(id).includes(e))return;box.querySelector("input").insertAdjacentHTML("beforebegin",tagHTML(e))});
  $("sg_"+id).innerHTML=sugHTML(id,destLer(id))}
function destKey(ev,id){if(["Enter",",",";"," "].includes(ev.key)){ev.preventDefault();destAdd(id,ev.target.value);ev.target.value=""}
  else if(ev.key==="Backspace"&&!ev.target.value){const t=$(id).querySelectorAll(".tag");if(t.length){t[t.length-1].remove();$("sg_"+id).innerHTML=sugHTML(id,destLer(id))}}}
function destSug(btn){document.querySelectorAll(".dest").forEach(d=>{const s=$("sg_"+d.id);if(s)s.innerHTML=sugHTML(d.id,destLer(d.id))})}

/* ---------------- abrir cartão ---------------- */
async function abrir(id){
  let r,mails=[];try{[r,mails]=await Promise.all([rpc("sol_cartao",{p_token:TOKEN,p_id:id}),rpc("sol_emails_cartao",{p_token:TOKEN,p_cartao:id})])}catch(e){alert(e.message);return}
  const c=r.cartao,interno=QUEM.tipo==="interno";CUR=c;
  const mailById=Object.fromEntries((mails||[]).map(m=>[m.id,m]));
  const primeiro=!(mails||[]).some(m=>!/^Acesso ao quadro/.test(m.assunto));
  const tl=r.historico.map(h=>evHTML(h,mailById)).join("");
  const pub=r.link||(location.origin+location.pathname+"?d="+c.slug);DOCS=r.docs||[];
  dlg(`<div class="dh"><h3><span class="chip ${c.situacao}">${esc(sitTxt(c))}</span><br>${esc(c.assunto)}</h3><button class="x" onclick="fechar()">✕ Fechar</button></div>
  <div class="db">${stBtns(c)}${form(c)}
  <div class="fl" style="margin-top:12px"><label class="fl">Documentos</label>
   <div class="anx">${DOCS.map(a=>`<span>📎 <a onclick="baixar(${a.id})">${esc(a.nome)}</a> ${kb(a.tamanho)}${interno&&QUEM.edita?` <a title="remover" onclick="docDel(${a.id},${c.id})">×</a>`:""}</span>`).join("")||'<span class="note" style="border:0;background:none;padding:0">Nenhum documento ainda.</span>'}</div>
   ${QUEM.edita?`<label class="btn" style="margin-top:6px;align-self:flex-start">📎 Anexar documento<input type="file" multiple class="hidden" onchange="docEnviar(this,${c.id})"></label>`:""}
   <div class="msg" id="dMsg"></div></div>
  <p class="note">Link para acompanhar (só ver, sem senha): <a href="${esc(pub)}" target="_blank" rel="noopener">${esc(pub)}</a> <button class="btn" type="button" onclick="copiar('${esc(pub)}',this)">Copiar</button></p>
  <div class="acts">${QUEM.admin?'<button class="btn d" id="cDel">Apagar</button>':""}<span style="flex:1"></span>
   ${QUEM.edita?'<button class="btn" id="cRep">↪ Repassar</button>':""}
   ${interno&&QUEM.edita?`<button class="btn ${primeiro?"p":""}" id="cMail">✉ ${primeiro?"Enviar o pedido por e-mail":"Enviar e-mail"}</button>`:""}
   <button class="btn" onclick="fechar()">Fechar</button>${QUEM.edita?'<button class="btn p" id="cSalvar">Salvar</button>':""}</div>
  <div class="msg" id="cMsg"></div>
  <div class="tl"><h4>Andamento</h4>
   ${QUEM.edita?`<div class="cbox"><textarea id="cCom" rows="2" placeholder="Escreva uma atualização (ex.: começamos, previsão, dúvida)…"></textarea><button class="btn p" id="cEnviar">Enviar</button></div>`:""}
   ${tl||'<div class="note">Sem registros.</div>'}</div></div>`);
  ligaSt();
  if($("cSalvar"))$("cSalvar").onclick=async()=>{const d=coletar(c);if(!Object.keys(d).length){fechar();return}
    msg("cMsg","Salvando…");try{await rpc("sol_salvar",{p_token:TOKEN,p_id:c.id,p_dados:d});await carregar(false);abrir(c.id)}catch(e){msg("cMsg",e.message,"err")}};
  if($("cEnviar"))$("cEnviar").onclick=async()=>{const t=$("cCom").value.trim();if(!t)return;
    if(!(await guardar()))return;
    try{await rpc("sol_comentar",{p_token:TOKEN,p_id:c.id,p_texto:t});await carregar(false);abrir(c.id)}catch(e){msg("cMsg",e.message,"err")}};
  if($("cMail"))$("cMail").onclick=async()=>{
    // guarda o que foi editado no cartão antes de abrir o e-mail
    if(!(await guardar()))return;CUR=null;
    compor(c,DOCS,primeiro)};
  if($("cRep"))$("cRep").onclick=async()=>{if(await guardar())repassar(c)};
  if($("cDel"))$("cDel").onclick=async()=>{if(!confirm("Apagar este cartão e todo o histórico? Não dá para desfazer."))return;
    try{await rpc("sol_remover",{p_token:TOKEN,p_id:c.id});fechar();carregar(false)}catch(e){msg("cMsg",e.message,"err")}};
}
function copiar(t,b){try{navigator.clipboard.writeText(t);b.textContent="Copiado"}catch(e){prompt("Copie:",t)}}
const ST_MAIL={pendente:"na fila (sai em até 1 min)",enviando:"enviando…",enviado:"enviado",erro:"NÃO enviado"};
function evHTML(h,mailById){
  let extra="";
  if(h.tipo==="email"){const m=mailById&&h.dados&&mailById[h.dados.email_id];
    if(m)extra=`<div class="note">${m.para?"Para: "+esc(m.para.concat(m.cc||[]).join(", "))+" · ":""}${esc(ST_MAIL[m.status]||m.status)}${m.erro?" — "+esc(m.erro):""}</div>
      <details><summary class="note">ver texto</summary><div style="white-space:pre-wrap;font-size:13px;margin-top:4px">${esc(m.corpo)}</div></details>
      ${m.anexos&&m.anexos.length?`<div class="anx">${m.anexos.map(a=>`<span>📎 <a onclick="baixar(${a.id})">${esc(a.nome)}</a> ${kb(a.tamanho)}</span>`).join("")}</div>`:""}`;
    else if(h.dados&&h.dados.anexos&&h.dados.anexos.length)extra=`<div class="anx">${h.dados.anexos.map(a=>`<span>📎 ${esc(a)}</span>`).join("")}</div>`;}
  else if(h.dados&&h.tipo!=="comentario")extra=detalhe(h.dados);
  return `<div class="ev ${h.tipo}"><div class="d">${dtBR(h.ts)}</div><div class="t"><b>${esc(h.quem||"")}</b> ${h.tipo==="comentario"?"<br>":"· "}${esc(h.texto||"")}${extra}</div></div>`}
const NOMES={status:"status",responsavel:"responsável",inicio_em:"começou em",prazo:"prazo",entregue_em:"entregue em",ultimo_contato:"último contato",
  fornecedor:"fornecedor",assunto:"assunto",descricao:"observações",link:"link",enviado_em:"enviado em",emails:"e-mails"};
function detalhe(d){const p=Object.entries(d).filter(([k,v])=>k!=="status"&&k!=="ultimo_contato"&&Array.isArray(v)).map(([k,[a,b]])=>{
  const f=v=>v==null||v===""?"vazio":Array.isArray(v)?v.join(", "):/^\d{4}-\d\d-\d\d/.test(v)?dBR(v):v;return `${NOMES[k]||k}: ${esc(f(a))} → ${esc(f(b))}`});
  return p.length?`<div class="note">${p.join("<br>")}</div>`:""}
function salvarArq(a){const bin=atob(a.base64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([u],{type:a.tipo||"application/octet-stream"}));l.download=a.nome;document.body.appendChild(l);l.click();l.remove()}
async function baixarPub(k,id){try{salvarArq(await rpc("sol_anexo_publico",{p_chave:k,p_id:id}))}catch(e){alert(e.message)}}
async function baixar(id){try{const a=await rpc("sol_anexo",{p_token:TOKEN,p_id:id});
  const bin=atob(a.base64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([u],{type:a.tipo||"application/octet-stream"}));l.download=a.nome;l.click();}catch(e){alert(e.message)}}

/* ---------------- repassar para alguém de fora ---------------- */
function repassar(c){
  dlg(`<div class="dh"><h3>Repassar a demanda</h3><button class="x" onclick="abrir(${c.id})">✕ Fechar</button></div><div class="db">
  <p class="note">A pessoa passa a ser a responsável. ${QUEM.admin?"":"O Mizael recebe um aviso e, quando aprovar, ela recebe por e-mail um número de acesso (entra com o e-mail dela + o número) para atualizar esta demanda."}</p>
  <div class="grid"><label class="fl">Nome<input id="rNome"></label><label class="fl">E-mail<input id="rEmail" type="email"></label>
  <label class="fl full">Recado (opcional)<textarea id="rMsg" rows="2" placeholder="ex.: vai cuidar da parte do mapa"></textarea></label></div>
  <div class="acts"><button class="btn" onclick="abrir(${c.id})">Cancelar</button><button class="btn p" id="rOk">Repassar</button></div><div class="msg" id="rRes"></div></div>`,true);
  $("rOk").onclick=async()=>{try{const r=await rpc("sol_repassar",{p_token:TOKEN,p_cartao:c.id,p_nome:$("rNome").value,p_email:$("rEmail").value,p_mensagem:$("rMsg").value});
    await carregar(false);
    if(r==="ja_tem_acesso"){msg("rRes","Repassado. Essa pessoa já tem acesso e vai receber os avisos de prazo.","ok")}
    else if(QUEM.admin){acessos();return}
    else msg("rRes","Repassado. Pedido de acesso enviado para aprovação. Assim que aprovar, a pessoa recebe por e-mail o número de acesso.","ok");
    $("rOk").outerHTML=`<button class="btn p" onclick="abrir(${c.id})">Voltar ao cartão</button>`;
  }catch(e){msg("rRes",e.message,"err")}};
}
async function decidir(id,ok){
  if(!ok&&!confirm("Recusar este pedido de acesso?"))return;
  try{const r=await rpc("sol_pedido_decidir",{p_token:TOKEN,p_id:id,p_aprovar:ok});PEDIDOS=await rpc("sol_pedidos_lista",{p_token:TOKEN})||[];avisos(false);
    await acessos();if(ok)msg("kPed",`Aprovado. Número de acesso: ${r.senha} — ${r.email_enviado?"vai por e-mail em até 1 minuto":"anote e passe para a pessoa"}.`,"ok");
  }catch(e){msg("kPed",e.message,"err")}}

/* ---------------- documentos ---------------- */
let DOCS=[];
const lerB64=f=>new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok({nome:f.name,tipo:f.type||"application/octet-stream",base64:String(r.result).split(",")[1]||""});r.onerror=er;r.readAsDataURL(f)});
async function docEnviar(inp,id){const fs=[...inp.files];inp.value="";
  if(!(await guardar()))return;
  for(const f of fs){if(f.size>MAX_ANEXOS){msg("dMsg",f.name+" passa de 15 MB.","err");return}
    msg("dMsg","Enviando "+f.name+"…");try{const a=await lerB64(f);await rpc("sol_doc_enviar",{p_token:TOKEN,p_cartao:id,p_nome:a.nome,p_tipo:a.tipo,p_base64:a.base64})}catch(e){msg("dMsg",e.message,"err");return}}
  await carregar(false);abrir(id)}
async function docDel(aid,id){if(!confirm("Remover este documento do cartão?"))return;if(!(await guardar()))return;try{await rpc("sol_doc_remover",{p_token:TOKEN,p_id:aid});abrir(id)}catch(e){alert(e.message)}}

/* ---------------- escrever e-mail (também é a "Nova solicitação") ---------------- */
let ANEXOS=[];
const RASC={};   // rascunho de cada e-mail (por cartão): nada se perde ao fechar ou anexar
function compor(c,docs,primeiro){
  const nova=!c;c=c||{fornecedor:"TFleet",emails:[]};docs=docs||[];
  const rk=nova?"nova":"c"+c.id;let rs=RASC[rk];
  if(!rs){try{const g=ls.get("tf_sol_rasc_"+rk);if(g)rs=RASC[rk]=Object.assign(g,{anexos:[]})}catch(e){}}
  ANEXOS=rs?rs.anexos:[];
  const volta=nova?"fecharRasc()":"abrir("+c.id+")";
  dlg(`<div class="dh"><h3>${nova?"Nova solicitação":"Enviar e-mail · "+esc(c.fornecedor)}</h3><button class="x" onclick="${volta}">✕ Fechar</button></div><div class="db">
  ${nova?`<div class="grid" style="margin-bottom:10px"><label class="fl">Fornecedor<input id="mForn" value="${esc(c.fornecedor)}" list="dlForn2"></label>
    <label class="fl">Prazo de entrega (se já tiver)<input id="mPrazo" type="date"></label></div>
    <datalist id="dlForn2">${[...new Set(CARDS.map(x=>x.fornecedor))].map(f=>`<option value="${esc(f)}">`).join("")}</datalist>`:""}
  <label class="fl">Para</label>${destHTML("dPara",c.emails||[])}
  <details style="margin:8px 0"><summary class="note">Cópia (Cc)</summary>${destHTML("dCc",[])}</details>
  <div class="grid"><label class="fl full">Assunto${nova?" (vira o título do cartão)":""}<input id="mAss" value="${esc(c.assunto||"")}"></label>
  <label class="fl full">Texto do e-mail<textarea id="mCorpo" rows="10" placeholder="Prezados,&#10;&#10;…">${primeiro?esc(c.descricao||""):""}</textarea></label></div>
  <p class="note">No fim do e-mail vai automaticamente o botão <b>"Veja a gestão dessa demanda"</b>, com o link para acompanhar (só ver) e baixar os documentos. Para atualizar, a pessoa entra com a senha dela.</p>
  <label class="fl" style="margin-top:6px">Anexos</label>
  ${docs.length?`<div class="anx">${docs.map(a=>`<span><label><input type="checkbox" class="mDoc" value="${a.id}" data-t="${a.tamanho}" checked onchange="mostraAnx()"> 📎 ${esc(a.nome)} ${kb(a.tamanho)}</label></span>`).join("")}</div>`:""}
  <label class="btn" style="margin-top:6px">📎 Anexar arquivos (PDF, Word, Excel…)<input type="file" id="mArq" multiple class="hidden"></label>
  <div class="anx" id="mAnx"></div>
  <div class="acts"><button class="btn" onclick="${volta}" title="O que você escreveu fica guardado como rascunho">Fechar (guarda o rascunho)</button>${nova?'<button class="btn" id="mReg" title="Cria o cartão com esse texto e os arquivos, sem mandar e-mail">Só registrar (já mandei por fora)</button>':""}<button class="btn p" id="mEnviar">Enviar e-mail</button></div>
  <div class="msg" id="mMsg"></div>
  <p class="note">Sai pelo Gmail do Mizael em até 1 minuto. Quem está em Para e Cc passa a receber os avisos de prazo e fica salvo nos contatos. Os arquivos ficam guardados no cartão.</p></div>`);
  $("mArq").onchange=e=>{[...e.target.files].forEach(f=>ANEXOS.push(f));e.target.value="";mostraAnx();guardaRasc()};
  // devolve o rascunho, se tiver
  if(rs){if(nova){$("mForn").value=rs.forn||"";$("mPrazo").value=rs.prazo||""}
    $("mAss").value=rs.ass;$("mCorpo").value=rs.corpo;
    $("dPara").querySelectorAll(".tag").forEach(t=>t.remove());(rs.para||[]).forEach(e=>destAdd("dPara",e));
    (rs.cc||[]).forEach(e=>destAdd("dCc",e));
    document.querySelectorAll(".mDoc").forEach(x=>x.checked=!rs.docs||rs.docs.includes(+x.value));mostraAnx();
    msg("mMsg","Rascunho recuperado.","ok")}
  const guardaRasc=()=>{if(!$("mAss"))return;const o={para:destLer("dPara"),cc:destLer("dCc"),ass:$("mAss").value,corpo:$("mCorpo").value,
      docs:[...document.querySelectorAll(".mDoc")].filter(x=>x.checked).map(x=>+x.value),forn:nova?$("mForn").value:null,prazo:nova?$("mPrazo").value:null};
    RASC[rk]=Object.assign(o,{anexos:ANEXOS});ls.set("tf_sol_rasc_"+rk,o)};
  window.guardaRasc=guardaRasc;window.limpaRasc=()=>{delete RASC[rk];ls.del("tf_sol_rasc_"+rk)};
  const box=$("dlg").querySelector(".db");["input","change"].forEach(ev=>box.addEventListener(ev,guardaRasc));box.addEventListener("click",()=>setTimeout(()=>{if($("mAss"))guardaRasc()},0));
  const ler=()=>{destAdd("dPara",$("dPara").querySelector("input").value);destAdd("dCc",$("dCc").querySelector("input").value);
    return {para:destLer("dPara"),cc:destLer("dCc"),ass:$("mAss").value.trim(),corpo:$("mCorpo").value,
      docs:[...document.querySelectorAll(".mDoc:checked")].map(x=>+x.value)}};
  const criarCartao=async(f,descricao)=>{const forn=$("mForn").value.trim();if(!forn)throw new Error("Preencha o fornecedor.");
    const d={fornecedor:forn,assunto:f.ass,status:"Enviado",enviado_em:hoje(),ultimo_contato:hoje(),emails:f.para.concat(f.cc)};
    if($("mPrazo").value)d.prazo=$("mPrazo").value;if(descricao)d.descricao=descricao;
    const r=await rpc("sol_salvar",{p_token:TOKEN,p_id:null,p_dados:d});c=r;return r};
  $("mEnviar").onclick=async()=>{const f=ler();
    if(!f.para.length){msg("mMsg","Coloque pelo menos um e-mail em Para.","err");return}
    if(!f.ass||!f.corpo.trim()){msg("mMsg","Preencha assunto e texto.","err");return}
    if(totalAnx()>MAX_ANEXOS){msg("mMsg","Anexos passam de 15 MB. Tire algum arquivo.","err");return}
    $("mEnviar").disabled=true;msg("mMsg","Preparando anexos…");
    try{const anexos=await Promise.all(ANEXOS.map(lerB64));
      if(nova&&!c.id)await criarCartao(f);
      msg("mMsg","Enviando…");
      if(primeiro&&!nova&&f.corpo!==(c.descricao||""))await rpc("sol_salvar",{p_token:TOKEN,p_id:c.id,p_dados:{descricao:f.corpo,enviado_em:hoje()}});
      await rpc("sol_email_enviar",{p_token:TOKEN,p_cartao:c.id,p_para:f.para,p_cc:f.cc,p_assunto:f.ass,p_corpo:f.corpo,p_anexos:anexos,p_docs:f.docs});
      limpaRasc();CONTATOS=await rpc("sol_contatos_lista",{p_token:TOKEN})||CONTATOS;await carregar(false);abrir(c.id);
    }catch(e){$("mEnviar").disabled=false;msg("mMsg",e.message,"err")}};
  if($("mReg"))$("mReg").onclick=async()=>{const f=ler();
    if(!f.ass){msg("mMsg","Preencha o assunto.","err");return}
    $("mReg").disabled=true;msg("mMsg","Salvando…");
    try{if(!c.id)await criarCartao(f,f.corpo.trim()||null);
      for(const file of ANEXOS){const a=await lerB64(file);await rpc("sol_doc_enviar",{p_token:TOKEN,p_cartao:c.id,p_nome:a.nome,p_tipo:a.tipo,p_base64:a.base64})}
      limpaRasc();await carregar(false);abrir(c.id);
    }catch(e){$("mReg").disabled=false;msg("mMsg",e.message,"err")}};
}
function totalAnx(){return ANEXOS.reduce((s,f)=>s+f.size,0)+[...document.querySelectorAll(".mDoc:checked")].reduce((s,x)=>s+(+x.dataset.t||0),0)}
function mostraAnx(){const tot=totalAnx();
  $("mAnx").innerHTML=ANEXOS.map((f,i)=>`<span>📎 ${esc(f.name)} ${kb(f.size)} <a onclick="ANEXOS.splice(${i},1);mostraAnx()">×</a></span>`).join("")+(tot?`<span class="note" style="border:0;background:none">${kb(tot)} de 15 MB</span>`:"")}

function fecharRasc(){if(window.guardaRasc)try{guardaRasc()}catch(e){}$("ov").classList.add("hidden")}
/* ---------------- nova solicitação ---------------- */
$("bNovo").onclick=()=>compor(null);

/* ---------------- contatos e acessos (uma tela só) ---------------- */
$("bContatos").onclick=()=>acessos();
const contatos=()=>acessos();
const SIT=c=>{const a=c.acesso;if(!c.tem_acesso)return'<span class="note">sem acesso</span>';if(!a)return'<span class="st ok">tem acesso</span>';
  if(a.travado)return'<span class="st err">travado 15 min</span>';if(!a.ativo)return'<span class="note">desativado</span>';
  return`<span class="st ok">ativo</span><br><span class="note">${a.ultimo_acesso?"entrou "+dtBR(a.ultimo_acesso):"nunca entrou"}${a.fornecedor==="*"?" · vê tudo":""}</span>`};
async function acessos(){
  let cfg={};
  try{const r=await Promise.all([rpc("sol_contatos_lista",{p_token:TOKEN}),
      QUEM.admin?rpc("sol_config_ver",{p_token:TOKEN}):null,QUEM.admin?rpc("sol_pedidos_lista",{p_token:TOKEN}):[]]);
    CONTATOS=r[0]||[];cfg=r[1]||{};PEDIDOS=r[2]||[];if(QUEM.admin)avisos(false)}catch(e){alert(e.message);return}
  const adm=QUEM.admin,inp=(id,v)=>`<input id="${id}" value="${esc(v||"")}" style="width:100%;min-width:130px;border:1px solid var(--line);border-radius:6px;padding:4px">`;
  dlg(`<div class="dh"><h3>Contatos e acessos</h3><button class="x" onclick="fechar()">✕ Fechar</button></div><div class="db">
  ${adm&&PEDIDOS.length?`<h4 class="sec4" style="color:var(--brand-ink)">Pedidos de acesso</h4>
  <table class="tbl">${PEDIDOS.map(p=>`<tr><td><b>${esc(p.nome)}</b><br><span class="note">${esc(p.email)} · ${esc(p.fornecedor)}</span></td>
   <td class="note">pedido por ${esc(p.pedido_por)}${p.assunto?"<br>"+esc(p.assunto):""}${p.mensagem?"<br>“"+esc(p.mensagem)+"”":""}</td>
   <td style="white-space:nowrap"><button class="btn p" onclick="decidir(${p.id},true)">Aprovar</button> <button class="btn d" onclick="decidir(${p.id},false)">Recusar</button></td></tr>`).join("")}</table>`:""}
  <div class="msg" id="kPed"></div>
  <p class="note">Quem recebe e-mail pelo quadro entra aqui sozinho.${adm?" Para a pessoa poder atualizar os cartões, clique em <b>Dar acesso</b> e digite só o número (ex.: 4 últimos do celular). Ela entra com o <b>e-mail + esse número</b> e vê só os cartões do fornecedor dela.":""}</p>
  <table class="tbl"><tr><th>Nome</th><th>E-mail</th><th>Fornecedor</th>${adm?"<th>Acesso</th>":""}<th></th></tr>
  ${CONTATOS.map((c,i)=>`<tr><td>${inp("cn"+i,c.nome)}</td><td>${esc(c.email)}</td><td>${inp("cf"+i,c.acesso&&c.acesso.fornecedor==="*"?"*":c.fornecedor)}</td>
   ${adm?`<td>${SIT(c)}</td>`:""}
   <td style="white-space:nowrap"><button class="btn" onclick="ctSalvar(${i})">Salvar</button>
   ${adm?(c.acesso?`<button class="btn" onclick="acNumero(${i})">Trocar número</button> <button class="btn" onclick="acAtivo(${i},${!c.acesso.ativo||c.acesso.travado})">${c.acesso.ativo&&!c.acesso.travado?"Desativar":"Reativar"}</button>`
       :`<button class="btn p" onclick="acNumero(${i})">Dar acesso</button>`):""}
   <button class="btn d" title="Remover" onclick="ctDel(${i})">×</button></td></tr>`).join("")||`<tr><td colspan="5" class="note">Nenhum ainda.</td></tr>`}</table>
  <h4 class="sec4" style="margin-top:16px">Adicionar contato</h4>
  <div class="grid"><label class="fl">Nome<input id="ctN"></label><label class="fl">E-mail<input id="ctE" type="email"></label><label class="fl">Fornecedor<input id="ctF" value="TFleet"></label></div>
  <div class="acts"><button class="btn p" onclick="ctNovo()">Adicionar</button></div><div class="msg" id="ctMsg"></div>
  ${adm?`<h4 class="sec4" style="margin-top:18px">Robô de e-mail (Apps Script)</h4>
  <p class="note">Chave do robô: cole no script <b>solicitacoes-aviso.gs</b>. Não mande para ninguém.</p>
  <code class="key" id="kRobo">${esc(cfg.chave_robo)}</code> <button class="btn" onclick="copiar($('kRobo').textContent,this)">Copiar</button>
  <div class="grid" style="margin-top:10px"><label class="fl">Avisar "sem resposta" após (dias)<input id="kDias" type="number" min="1" value="${cfg.dias_sem_resposta}"></label></div>
  <div class="acts" style="justify-content:flex-start"><button class="btn" id="kSalvar">Salvar dias</button><button class="btn d" id="kNova">Gerar chave nova</button></div>
  <div class="msg" id="kMsg"></div>`:""}</div>`);
  if(!adm)return;
  $("kSalvar").onclick=async()=>{try{await rpc("sol_config_salvar",{p_token:TOKEN,p_dias:+$("kDias").value,p_nova_chave:false});msg("kMsg","Salvo.","ok");carregar(false)}catch(e){msg("kMsg",e.message,"err")}};
  $("kNova").onclick=async()=>{if(!confirm("Gerar chave nova? O script para de funcionar até você colar a nova."))return;
    try{const c=await rpc("sol_config_salvar",{p_token:TOKEN,p_dias:+$("kDias").value,p_nova_chave:true});$("kRobo").textContent=c.chave_robo;msg("kMsg","Chave nova gerada.","ok")}catch(e){msg("kMsg",e.message,"err")}};
}
async function ctNovo(){try{await rpc("sol_contato_salvar",{p_token:TOKEN,p_id:null,p_nome:$("ctN").value,p_email:$("ctE").value,p_fornecedor:$("ctF").value});acessos()}catch(e){msg("ctMsg",e.message,"err")}}
async function ctSalvar(i){const c=CONTATOS[i],nome=$("cn"+i).value.trim(),forn=$("cf"+i).value.trim();
  try{if(forn!=="*"||!c.acesso)await rpc("sol_contato_salvar",{p_token:TOKEN,p_id:c.contato_id,p_nome:nome,p_email:c.email,p_fornecedor:forn==="*"?"":forn});
    if(c.acesso)await rpc("sol_pessoa_salvar",{p_token:TOKEN,p_id:c.acesso.id,p_nome:nome,p_fornecedor:forn,p_email:c.email,p_senha:null,p_ativo:c.acesso.ativo});
    acessos()}catch(e){msg("ctMsg",e.message,"err")}}
async function ctDel(i){const c=CONTATOS[i];
  if(!confirm(c.acesso?"Remover este contato e o acesso dele?":"Remover este contato?"))return;
  try{if(c.acesso)await rpc("sol_pessoa_remover",{p_token:TOKEN,p_id:c.acesso.id});
    if(c.contato_id)await rpc("sol_contato_remover",{p_token:TOKEN,p_id:c.contato_id});acessos()}catch(e){msg("ctMsg",e.message,"err")}}
async function acAtivo(i,ativo){const c=CONTATOS[i],a=c.acesso;
  try{await rpc("sol_pessoa_salvar",{p_token:TOKEN,p_id:a.id,p_nome:c.nome,p_fornecedor:a.fornecedor,p_email:c.email,p_senha:null,p_ativo:ativo});acessos()}catch(e){msg("ctMsg",e.message,"err")}}
function acNumero(i){const c=CONTATOS[i],a=c.acesso,forn=$("cf"+i).value.trim()||c.fornecedor||"",nome=$("cn"+i).value.trim()||c.nome||"";
  dlg(`<div class="dh"><h3>${a?"Trocar número":"Dar acesso"}</h3><button class="x" onclick="acessos()">✕ Fechar</button></div><div class="db">
  <p><b>${esc(nome||c.email)}</b><br><span class="note">${esc(c.email)}</span></p>
  ${nome?"":`<label class="fl full">Nome<input id="aNome"></label>`}
  <label class="fl full">Número de acesso (ex.: 4 últimos do celular)<input id="aNum" inputmode="numeric" autocomplete="off" maxlength="12" style="font-size:22px;letter-spacing:6px"></label>
  <label class="fl full">O que pode ver<select id="aForn">
    ${forn&&forn!=="*"?`<option value="${esc(forn)}">Só os cartões de ${esc(forn)}</option>`:""}
    <option value="*" ${forn==="*"?"selected":""}>Tudo (é da casa: edita e envia e-mail, sem mexer em acessos)</option></select></label>
  ${!forn?'<p class="note">Para limitar aos cartões de um fornecedor, feche, preencha o Fornecedor do contato e clique em Salvar.</p>':""}
  <p class="note">Ela entra no quadro com <b>${esc(c.email)}</b> + esse número. 5 erros seguidos travam o acesso por 15 minutos.</p>
  <div class="acts"><button class="btn" onclick="acessos()">Voltar</button><button class="btn p" id="aOk">${a?"Trocar":"Criar acesso"}</button></div>
  <div class="msg" id="aMsg"></div></div>`,true);
  $("aNum").focus();
  $("aOk").onclick=async()=>{const n=$("aNum").value.trim(),nm=nome||($("aNome")&&$("aNome").value.trim());
    if(n.length<4){msg("aMsg","Digite pelo menos 4 números.","err");return}
    if(!nm){msg("aMsg","Coloque o nome da pessoa.","err");return}
    try{await rpc("sol_pessoa_salvar",{p_token:TOKEN,p_id:a?a.id:null,p_nome:nm,p_fornecedor:$("aForn").value,p_email:c.email,p_senha:n,p_ativo:true});
      await acessos();msg("ctMsg",`Pronto: ${nm} entra com ${c.email} + ${n}.`,"ok")}catch(e){msg("aMsg",e.message,"err")}};
}
/* ---------------- link público (só ver) ---------------- */
async function publico(chave){
  const v=$("vPub");v.classList.remove("hidden");v.innerHTML='<p class="note">Carregando…</p>';
  let r;try{r=await rpc("sol_publico",{p_chave:chave})}catch(e){v.innerHTML='<p class="msg err">Erro: '+esc(e.message)+'</p>';return}
  if(r.erro){v.innerHTML='<div class="pubcard" style="--c:#94a3b8"><p>'+esc(r.erro)+'</p><button class="btn p" onclick="mostrarLogin()">Entrar</button></div>';return}
  const c=r.cartao,cor=COR[c.status]||"#475569";
  const em=(r.emails||[]).map(m=>`<div class="ev email"><div class="d">${dtBR(m.criado_em)}</div><div class="t"><b>${esc(m.assunto)}</b>
    <details><summary class="note">ver texto</summary><div style="white-space:pre-wrap;font-size:13px;margin-top:4px">${esc(m.corpo)}</div></details>
    ${m.anexos&&m.anexos.length?`<div class="anx">${m.anexos.map(a=>`<span>📎 ${esc(a)}</span>`).join("")}</div>`:""}</div></div>`).join("");
  v.innerHTML=`<header class="top" style="padding:4px 0 12px"><div class="tt"><h1>Gestão da demanda</h1><p class="sub">Gestão Integrada · só visualização</p></div>
    <button class="btn p" onclick="mostrarLogin()">Entrar para atualizar</button></header>
  <div class="pubcard" style="--c:${cor}">
    <div class="f note" style="font-weight:700;text-transform:uppercase;letter-spacing:.04em">${esc(c.fornecedor)}</div>
    <h2 style="margin:2px 0 8px;font-size:20px">${esc(c.assunto)}</h2>
    <div class="st"><span class="chip" style="background:${cor};color:#fff">${esc(c.status)}</span> <span class="chip ${c.situacao}">${esc(sitTxt(c))}</span></div>
    <div class="kv"><div><b>Responsável</b>${esc(c.responsavel||"—")}</div><div><b>Enviado em</b>${dBR(c.enviado_em)}</div><div><b>Começou em</b>${dBR(c.inicio_em)}</div>
      <div><b>Prazo</b>${dBR(c.prazo)}${c.prazo_original&&c.prazo_original!==c.prazo?` <span class="note">(1º: ${dBR(c.prazo_original)})</span>`:""}</div><div><b>Entregue em</b>${dBR(c.entregue_em)}</div><div><b>Último contato</b>${dBR(c.ultimo_contato)}</div></div>
    ${c.descricao?`<div class="pedido">${esc(c.descricao)}</div>`:""}
    ${c.observacoes?`<div class="tl"><h4>Observações / próximos passos</h4><p style="white-space:pre-wrap;margin:0">${esc(c.observacoes)}</p></div>`:""}
    ${(r.docs||[]).length?`<div class="tl"><h4>Documentos</h4><div class="anx">${r.docs.map(a=>`<span>📎 <a onclick="baixarPub('${esc(chave)}',${a.id})">${esc(a.nome)}</a> ${kb(a.tamanho)}</span>`).join("")}</div></div>`:""}
    ${em?`<div class="tl"><h4>E-mails</h4>${em}</div>`:""}
    <div class="tl"><h4>Andamento</h4>${r.historico.filter(h=>h.tipo!=="email").map(h=>evHTML(h,null)).join("")||'<div class="note">Sem registros.</div>'}</div>
  </div>`;
}

iniciar();
</script>
</body>
</html>
